# ============================================================================
# KLIPPACE - VORON 2.4R2 (350mm) LED LIGHTING & ACE PRO COLOR SYNC
# ============================================================================
# Hardware Layout:
#   - Chamber Lighting: [neopixel Chamber_Lighting] (25 LEDs on Octopus Max EZ PE10)
#   - Toolhead Lighting: [neopixel hotend_rgb] (3 LEDs on EBB36 PC7)
#       * Index 1: Logo LED
#       * Index 2: Left Nozzle LED
#       * Index 3: Right Nozzle LED
#
# Features:
#   1. Toolhead Logo LED dynamically matches the active ACE Pro spool color.
#   2. Toggleable Nozzle LED mode:
#       * Mode 0 (Default): Pure white illumination for clear print visibility.
#       * Mode 1: Synchronized with the active spool color (matches Logo).
#   3. Automatic 15-minute inactivity idle shutdown (turns off chamber & toolhead).
#   4. Automatic activity wakeup (G28 homing, PRINT_START, toolchange, manual commands).
#   5. Dedicated Mainsail / Fluidd UI controls for chamber & nozzle lights.
# ============================================================================

# ----------------------------------------------------------------------------
# 1. STATE PERSISTENCE
# ----------------------------------------------------------------------------
[gcode_macro _LED_STATE]
description: Internal state persistence for LED lighting
variable_lights_on: 1
variable_sync_nozzle_to_spool: 0       # 0 = Pure white nozzle, 1 = Synchronized with spool color
variable_chamber_brightness: 0.8       # Default chamber brightness (0.0 - 1.0)
variable_nozzle_brightness: 1.0        # Default nozzle brightness (0.0 - 1.0)
gcode:
    # State storage only

# ----------------------------------------------------------------------------
# 2. STARTUP INITIALIZATION & 15-MINUTE IDLE TIMEOUT
# ----------------------------------------------------------------------------
[delayed_gcode _INIT_LEDS]
initial_duration: 1
gcode:
    # Initialize lighting at startup to configured brightness and spool colors
    LIGHTS_ON

[delayed_gcode _IDLE_LIGHTS_TIMEOUT]
initial_duration: 900                  # 15 minutes = 900 seconds
gcode:
    {% set is_printing = printer.print_stats.state == "printing" %}
    {% set is_paused = (printer.print_stats.state == "paused") or (printer.pause_resume.is_paused|default(false)) %}
    {% if not is_printing and not is_paused %}
        { action_respond_info("LED: 15-minute inactivity reached. Turning off lights.") }
        LIGHTS_OFF
    {% else %}
        # Do not turn off lights during an active or paused print
        UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900
    {% endif %}

# ----------------------------------------------------------------------------
# 3. WAKEUP & GENERAL LIGHT CONTROLS
# ----------------------------------------------------------------------------
[gcode_macro WAKE_LIGHTS]
description: Turn lights on and reset the 15-minute inactivity timer
gcode:
    UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900
    LIGHTS_ON

[gcode_macro LIGHTS_ON]
description: Turn on chamber lighting and toolhead LEDs (spool-matched logo + nozzle lights)
gcode:
    {% set st = printer['gcode_macro _LED_STATE'] %}
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=lights_on VALUE=1

    # 1. Turn on Chamber Lighting
    {% set cb = st.chamber_brightness|default(0.8)|float %}
    SET_LED LED=Chamber_Lighting RED={cb} GREEN={cb} BLUE={cb} TRANSMIT=1

    # 2. Update Toolhead LEDs to active spool color & nozzle preference
    UPDATE_SPOOL_LEDS

    # 3. Reset 15-minute timer
    UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900

[gcode_macro LIGHTS_OFF]
description: Turn off chamber and toolhead lighting
gcode:
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=lights_on VALUE=0
    SET_LED LED=Chamber_Lighting RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=0 TRANSMIT=1

# ----------------------------------------------------------------------------
# 4. SPOOL COLOR SYNCHRONIZATION
# ----------------------------------------------------------------------------
[gcode_macro UPDATE_SPOOL_LEDS]
description: Update toolhead Logo (and optionally Nozzle) LEDs to match the active ACE Pro spool color
gcode:
    {% set st = printer['gcode_macro _LED_STATE'] %}
    {% set raw_tool = params.TOOL|default(-2)|int %}
    {% if raw_tool == -2 %}
        {% set tool = printer['ace_state'].current_index|default(-1)|int %}
        {% if tool == -1 and printer.save_variables is defined and printer.save_variables.variables.ace_current_index is defined %}
            {% set tool = printer.save_variables.variables.ace_current_index|int %}
        {% endif %}
    {% else %}
        {% set mmu_shim = printer.mmu|default(none) %}
        {% if mmu_shim and mmu_shim.ttg_map is defined and raw_tool >= 0 and raw_tool < mmu_shim.ttg_map|length %}
            {% set tool = mmu_shim.ttg_map[raw_tool]|int %}
        {% else %}
            {% set tool = raw_tool %}
        {% endif %}
    {% endif %}

    # Default standby color when no tool is active (soft cool cyan)
    {% set r = 0.2 %}
    {% set g = 0.6 %}
    {% set b = 1.0 %}

    {% set ace = printer['ace_instance_0']|default(none) %}
    {% if ace and ace.slots and tool >= 0 and tool < ace.slots|length %}
        {% set slot_data = ace.slots[tool] %}
        {% set rgb = slot_data.color|default([255, 255, 255]) %}
        {% if rgb and rgb|length >= 3 %}
            {% set raw_r = rgb[0]|float / 255.0 %}
            {% set raw_g = rgb[1]|float / 255.0 %}
            {% set raw_b = rgb[2]|float / 255.0 %}
            # If black filament (0,0,0), use dim subtle slate so LED is not completely dark
            {% if raw_r < 0.05 and raw_g < 0.05 and raw_b < 0.05 %}
                {% set r = 0.15 %}
                {% set g = 0.15 %}
                {% set b = 0.20 %}
            {% else %}
                {% set r = raw_r %}
                {% set g = raw_g %}
                {% set b = raw_b %}
            {% endif %}
        {% endif %}
    {% endif %}

    # Only apply if lights are enabled
    {% if st.lights_on == 1 %}
        # Set Logo LED (Index 1) - TRANSMIT=0 batches with nozzle
        SET_LED LED=hotend_rgb RED={r} GREEN={g} BLUE={b} INDEX=1 TRANSMIT=0

        # Set Nozzle LEDs (Index 2 and 3)
        {% if st.sync_nozzle_to_spool == 1 %}
            SET_LED LED=hotend_rgb RED={r} GREEN={g} BLUE={b} INDEX=2 TRANSMIT=0
            SET_LED LED=hotend_rgb RED={r} GREEN={g} BLUE={b} INDEX=3 TRANSMIT=1
        {% else %}
            {% set nb = st.nozzle_brightness|default(1.0)|float %}
            SET_LED LED=hotend_rgb RED={nb} GREEN={nb} BLUE={nb} INDEX=2 TRANSMIT=0
            SET_LED LED=hotend_rgb RED={nb} GREEN={nb} BLUE={nb} INDEX=3 TRANSMIT=1
        {% endif %}
    {% endif %}

# ----------------------------------------------------------------------------
# 5. NOZZLE SPOOL SYNC TOGGLE
# ----------------------------------------------------------------------------
[gcode_macro TOGGLE_NOZZLE_SPOOL_SYNC]
description: Toggle nozzle LEDs between white illumination and active spool color
gcode:
    {% set st = printer['gcode_macro _LED_STATE'] %}
    {% set new_val = 0 if st.sync_nozzle_to_spool == 1 else 1 %}
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=sync_nozzle_to_spool VALUE={new_val}
    { action_respond_info("LED: Nozzle spool sync is now %s" % ("ENABLED (Matches spool)" if new_val == 1 else "DISABLED (Pure white illumination)")) }
    UPDATE_SPOOL_LEDS

[gcode_macro SET_NOZZLE_SPOOL_SYNC]
description: Enable or disable nozzle LED synchronization with active spool color (ENABLE=1 or ENABLE=0)
gcode:
    {% set enable = params.ENABLE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=sync_nozzle_to_spool VALUE={enable}
    { action_respond_info("LED: Nozzle spool sync is now %s" % ("ENABLED" if enable == 1 else "DISABLED")) }
    UPDATE_SPOOL_LEDS

# ----------------------------------------------------------------------------
# 6. CHAMBER LIGHT CONTROLS
# ----------------------------------------------------------------------------
[gcode_macro SET_CHAMBER_LIGHTS]
description: Set chamber lighting brightness (0.0 - 1.0) and optional RGB (e.g. BRIGHTNESS=0.8)
gcode:
    {% set b = params.BRIGHTNESS|default(params.VALUE|default(1.0))|float %}
    {% set r = params.RED|default(b)|float %}
    {% set g = params.GREEN|default(b)|float %}
    {% set bl = params.BLUE|default(b)|float %}
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=chamber_brightness VALUE={b}
    SET_LED LED=Chamber_Lighting RED={r} GREEN={g} BLUE={bl} TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900

[gcode_macro CHAMBER_LIGHTS_ON]
description: Turn on chamber lighting at configured brightness
gcode:
    {% set st = printer['gcode_macro _LED_STATE'] %}
    {% set cb = st.chamber_brightness|default(0.8)|float %}
    SET_LED LED=Chamber_Lighting RED={cb} GREEN={cb} BLUE={cb} TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900

[gcode_macro CHAMBER_LIGHTS_OFF]
description: Turn off chamber lighting
gcode:
    SET_LED LED=Chamber_Lighting RED=0 GREEN=0 BLUE=0 TRANSMIT=1

# ----------------------------------------------------------------------------
# 7. NOZZLE LIGHT CONTROLS
# ----------------------------------------------------------------------------
[gcode_macro SET_NOZZLE_LIGHTS]
description: Set nozzle illumination LED brightness (0.0 - 1.0)
gcode:
    {% set b = params.BRIGHTNESS|default(params.VALUE|default(1.0))|float %}
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=nozzle_brightness VALUE={b}
    SET_LED LED=hotend_rgb RED={b} GREEN={b} BLUE={b} INDEX=2 TRANSMIT=0
    SET_LED LED=hotend_rgb RED={b} GREEN={b} BLUE={b} INDEX=3 TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900

[gcode_macro NOZZLE_LIGHTS_ON]
description: Turn on nozzle illumination LEDs
gcode:
    {% set st = printer['gcode_macro _LED_STATE'] %}
    {% set nb = st.nozzle_brightness|default(1.0)|float %}
    SET_LED LED=hotend_rgb RED={nb} GREEN={nb} BLUE={nb} INDEX=2 TRANSMIT=0
    SET_LED LED=hotend_rgb RED={nb} GREEN={nb} BLUE={nb} INDEX=3 TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=_IDLE_LIGHTS_TIMEOUT DURATION=900

[gcode_macro NOZZLE_LIGHTS_OFF]
description: Turn off nozzle illumination LEDs
gcode:
    SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=0 INDEX=3 TRANSMIT=1

# ----------------------------------------------------------------------------
# 8. HOMING WAKEUP HOOK (G28 Wrapper)
# ----------------------------------------------------------------------------
[gcode_macro G28]
rename_existing: G28.1
description: Homing wrapper that automatically wakes up LED lighting
gcode:
    WAKE_LIGHTS
    G28.1 {rawparams}
