# ============================================================================
# KLIPPACE - VORON 2.4 HARDWARE SENSORS CONFIGURATION
# ============================================================================
# Hardware Mappings:
#   - Mainboard:       BIGTREETECH Octopus Max EZ ([mcu])
#   - Toolhead Board:  BIGTREETECH EBB36 GEN2 ([mcu EBB])
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY TOOLHEAD ENTRY SENSOR (Above Extruder Drive Gears)
# ----------------------------------------------------------------------------
# Pin: EBB:PD0 (labeled Extruder_Switch on EBB36 GEN2)
#
# Operational Role:
#   - Detects the initial arrival of filament as it exits the Bowden tube.
#   - When tripped during tool loading, ACE Pro driver instantly stops high-speed
#     Bowden feeding and transitions to slow, coordinated pressurized feeding.
# ----------------------------------------------------------------------------
[filament_switch_sensor filament_entry_sensor]
switch_pin: ^EBB:PD0               # Pullup enabled on EBB:PD0
pause_on_runout: False             # Runout monitoring is managed by KLIPPACE
event_delay: 3.0
pause_delay: 0.5
# Note: If switch reads inverted (shows "detected" when empty), invert with:
# switch_pin: ^!EBB:PD0

# ----------------------------------------------------------------------------
# 2. SECONDARY TOOLHEAD NOZZLE SENSOR (Below Extruder Gears / Hotend Entry)
# ----------------------------------------------------------------------------
# Pin: EBB:PA15 (labeled Toolhead_Switch on EBB36 GEN2)
#
# Operational Role:
#   - Detects when filament has successfully passed through the drive gears
#     and seated into the hotend melt zone.
#   - When tripped, ACE Pro halts coordinated feeding, engages passive feed assist,
#     and initiates the nozzle prime and wipe sequence.
# ----------------------------------------------------------------------------
[filament_switch_sensor filament_nozzle_sensor]
switch_pin: ^EBB:PA15              # Pullup enabled on EBB:PA15
pause_on_runout: False             # Managed by KLIPPACE
event_delay: 3.0
pause_delay: 0.5
# Note: If switch reads inverted (shows "detected" when empty), invert with:
# switch_pin: ^!EBB:PA15

# ----------------------------------------------------------------------------
# 3. OPTIONAL SENSORS (Disabled by default on Voron)
# ----------------------------------------------------------------------------

# Anycubic Return Detection Module (RDM) 4-in-1 buffer sensor
# Uncomment and configure pin if you have mounted an active RDM buffer:
# [filament_switch_sensor filament_runout_rdm]
# switch_pin: PG12                 # Set to an Octopus Max EZ endstop pin
# pause_on_runout: False

# Filament Motion Encoder (BTT SFS v2.0 or Anycubic encoder)
# [filament_motion_sensor ace_encoder]
# detection_length: 10.00
# extruder: extruder
# switch_pin: PG11                 # Set to an Octopus Max EZ sensor pin
# pause_on_runout: True
# event_delay: 3.0
# pause_delay: 0.5

# ----------------------------------------------------------------------------
# HARDWARE SAFETY NOTE (Servo Wiper):
# The Anycubic servo wiper ([servo servo_wipe]) is intentionally NOT defined here.
# On the EBB36 GEN2, servo pin definitions would conflict with the extruder
# stepper motor step pin (EBB:PB14).
# ----------------------------------------------------------------------------
