# ============================================================================
# KLIPPACE - VORON 2.4R2 (350mm) G-CODE MACROS
# ============================================================================
# Tailored specifically for:
#   - Voron CoreXY flying gantry (safe Z-hops, no bed dropping)
#   - A4T Crossbow Cutter / Gantry Pin at X2 Y357
#   - Blobifier Purge & Park Tray at X5 Y360 Z3.5
#   - Voron Nozzle Scrubber Brush at X96-X136 Y360 Z3.0
# ============================================================================

# ============================================================================
# 1. STATE VARIABLE STORAGE
# ============================================================================
[gcode_macro _ACE_STATE]
description: Internal state persistence for ACE toolchange sequences
variable_active: -1
variable_orig_target: 0
variable_pre_toolchange_fan: 0
variable_startup_toolchange: 0
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_zhop: 0.0
variable_has_saved_pos: 0
gcode:
    # State storage only

[gcode_macro _PAUSE_RESUME_STATE]
description: Internal state persistence for pause/resume events
variable_pause_nozzle_timeout_triggered: 0
variable_pre_pause_temp: 0
gcode:
    # State storage only

# ============================================================================
# 2. VELOCITY LIMIT HELPERS
# ============================================================================
[gcode_macro VEL_PUSH]
description: Save current toolhead velocity, acceleration, and SCV to stack
variable_saved_vel: 0
variable_saved_accel: 0
variable_saved_scv: 0
gcode:
    SET_GCODE_VARIABLE MACRO=VEL_PUSH VARIABLE=saved_vel VALUE={printer.toolhead.max_velocity}
    SET_GCODE_VARIABLE MACRO=VEL_PUSH VARIABLE=saved_accel VALUE={printer.toolhead.max_accel}
    SET_GCODE_VARIABLE MACRO=VEL_PUSH VARIABLE=saved_scv VALUE={printer.toolhead.square_corner_velocity}

[gcode_macro VEL_POP]
description: Restore previously saved toolhead velocity limits from stack
gcode:
    {% set p = printer["gcode_macro VEL_PUSH"] %}
    {% if p.saved_vel > 0 %}
        SET_VELOCITY_LIMIT VELOCITY={p.saved_vel} ACCEL={p.saved_accel} SQUARE_CORNER_VELOCITY={p.saved_scv}
    {% endif %}

# ============================================================================
# 3. TOOLHEAD POSITIONING & NOZZLE PARKING MACROS
# ============================================================================

# Move toolhead to safe rear purge position
[gcode_macro TO_THROW_POSITION]
description: Travel to safe rear purge / Blobifier tray position (X5 Y360)
gcode:
    {% if printer["gcode_macro BLOBIFIER_PARK"] is defined %}
        BLOBIFIER_PARK
    {% else %}
        {% set vars = printer["gcode_macro _ACE_VARS"] %}
        {% set speed = vars.poop_x_speed|default(12000)|int %}

        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}

        G90
        # Ensure safe Z clearance before moving across bed to rear
        {% if printer.toolhead.position.z < vars.poop_z %}
            G1 Z{vars.poop_z} F1500
        {% endif %}
        G1 X{vars.poop_x} Y{vars.poop_y} F{speed}
    {% endif %}

# Park nozzle on extended Blobifier tray during filament swaps
[gcode_macro PARK_ON_STOPPER]
description: Park nozzle on the extended Blobifier tray (replaces old silicone stopper)
gcode:
    BLOBIFIER_PARK

# Canonical PARK alias (parks nozzle on Blobifier tray)
[gcode_macro PARK]
description: Park nozzle on extended Blobifier tray (alias for BLOBIFIER_PARK)
gcode:
    BLOBIFIER_PARK

# Lift nozzle off Blobifier tray before moving to purge/wipe
[gcode_macro LIFT_FROM_STOPPER]
description: Lift nozzle off Blobifier tray to safe clearance height
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set z_speed = vars.stopper_z_speed|default(1500)|int %}
    {% set clear_z = vars.stopper_clear_z|default(15.0)|float %}

    SAVE_GCODE_STATE NAME=lift_stopper_state
    G90
    G1 Z{clear_z} F{z_speed}
    RESTORE_GCODE_STATE NAME=lift_stopper_state MOVE=0

# Move to cutter pin approach position
[gcode_macro TO_BLADE]
description: Travel safely to pre-cut approach position (X2 Y340) avoiding cutter arm
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set moves = vars.poop_x_speed|default(12000)|float %}
    {% set block_x = vars.cut_block_x|default(2.0)|float %}
    {% set block_y = vars.cut_block_y|default(340.0)|float %}
    {% set safe_y = vars.cut_safe_y|default(330.0)|float %}
    {% set clear_x = vars.cut_clear_x|default(35.0)|float %}
    {% set cur_x = printer.toolhead.position.x|float %}
    {% set cur_y = printer.toolhead.position.y|float %}
    {% set cur_z = printer.toolhead.position.z|float %}

    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

    G90
    {% if cur_z < 15.0 %}
        G1 Z15.0 F1500
    {% endif %}

    # Collision avoidance: if behind or alongside the cutter arm (Y too high)
    {% if cur_y > safe_y %}
        {% if cur_x < clear_x %}
            G0 X{clear_x} F{moves}
        {% endif %}
        G0 Y{safe_y} F{moves}
    {% endif %}

    # Align X in front of the arm, then enter along pure Y axis
    G0 X{block_x} Y{safe_y} F{moves}
    G0 Y{block_y} F{moves}

# ============================================================================
# 4. FILAMENT CUTTER MACRO (A4T Crossbow Cutter / Gantry Cutter Pin)
# ============================================================================
[gcode_macro CUT_TIP]
description: Cut filament tip using A4T Crossbow cutter at gantry pin X2 Y357
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set moves = params.moves|default(vars.poop_x_speed)|float %}
    {% set cuts = params.cuts|default(vars.cut_speed)|float %}
    {% set retract = params.retracts|default(-vars.cut_retract_distance)|float %}

    {% set cur_x = printer.toolhead.position.x|float %}
    {% set cur_y = printer.toolhead.position.y|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set block_x = vars.cut_block_x|default(2.0)|float %}
    {% set block_y = vars.cut_block_y|default(340.0)|float %}
    {% set engage_x = vars.cut_engage_x|default(2.0)|float %}
    {% set engage_y = vars.cut_engage_y|default(357.0)|float %}
    {% set safe_y = vars.cut_safe_y|default(330.0)|float %}
    {% set clear_x = vars.cut_clear_x|default(35.0)|float %}

    { action_respond_info("ACE: Initiating filament cut at gantry pin...") }

    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

    SAVE_GCODE_STATE NAME=cut_tip_state
    M83                  # Relative extrusion mode
    G90                  # Absolute positioning
    G92 E0

    # Ensure safe Z clearance before lateral travel
    {% if cur_z < 15.0 %}
        G1 Z15.0 F1500
    {% endif %}

    # ------------------------------------------------------------------------
    # Safe Cutter Pin Approach (Collision Avoidance)
    # The depressor arm extends along the left rail from Y=340 to Y=357 at X=2.
    # If the toolhead is behind the arm (Y too high):
    #   1. If X is too close to the arm (X < clear_x), adjust X outward first.
    #   2. Adjust Y forward to safe_y (in front of the arm).
    #   3. Align X to cut_block_x (X=2) safely in front of the arm.
    #   4. Move forward into pre-cut approach position (Y=340).
    # ------------------------------------------------------------------------
    {% if cur_y > safe_y %}
        # Toolhead is behind or alongside cutter arm
        {% if cur_x < clear_x %}
            # Adjust X coordinate outward to clear the arm
            G0 X{clear_x} F{moves}
        {% endif %}
        # Adjust Y coordinate forward in front of the arm
        G0 Y{safe_y} F{moves}
    {% endif %}

    # Align X in front of the arm at safe Y
    G0 X{block_x} Y{safe_y} F{moves}

    # 1. Approach cutter pin along pure Y axis (X2 Y340)
    G0 Y{block_y} F{moves}

    # 2. Engage cutter pin to depress blade arm (X2 Y357)
    G0 X{engage_x} Y{engage_y} F{cuts}

    # 3. Dwell momentarily to ensure clean shear
    {% if vars.cut_pause_ms|int > 0 %}
        G4 P{vars.cut_pause_ms|int}
    {% endif %}

    # 4. Retract filament while blade is depressed to disengage arm
    {% if printer.extruder.temperature > 190 %}
        G1 E{retract} F600
    {% else %}
        { action_respond_info("ACE: Extruder below 190C, skipping post-cut retraction") }
    {% endif %}

    # 5. Exit along pure Y axis back to safe position in front of cutter pin (X0 Y330)
    G0 X{block_x} Y{safe_y} F{moves}

    # 6. Step outward away from arm so subsequent moves do not clip it
    G0 X{clear_x} Y{safe_y} F{moves}

    RESTORE_GCODE_STATE NAME=cut_tip_state MOVE=0
    { action_respond_info("ACE: Filament cut completed successfully") }

# ============================================================================
# 5. PURGING & NOZZLE SCRUBBING MACROS
# ============================================================================

# Legacy stubs: all purging and ejection is handled primarily by Blobifier
[gcode_macro FLUSH_POOP]
description: Legacy stub - blob chilling and ejection is handled by Blobifier
gcode:
    # Managed by BLOBIFIER

[gcode_macro CLEAR_INITIAL_POOP]
description: Legacy stub - nozzle priming is handled by Blobifier
gcode:
    # Managed by BLOBIFIER

# Perform nozzle scrub across Voron decontaminator brush
[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
description: Scrub nozzle across the Voron decontaminator brush at X96-X136 Y360 Z3.0
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set start_x = vars.wipe_start_x|float %}
    {% set start_y = vars.wipe_start_y|float %}
    {% set wipe_dist = vars.wipe_length|float %}
    {% set qty = vars.wipe_qty|int %}
    {% set speed = vars.wipe_speed|int %}
    {% set brush_z = vars.brush_z|default(3.0)|float %}
    {% set clear_z = vars.brush_clear_z|default(10.0)|float %}

    SAVE_GCODE_STATE NAME=voron_wipe_state
    G90

    # 1. Travel above start of brush
    G1 X{start_x} Y{start_y} F{vars.poop_x_speed}

    # 2. Lower nozzle into brush bristles
    G1 Z{brush_z} F1500

    # 3. Perform scrub passes along X axis
    {% for pass in range(qty) %}
        G1 X{start_x + wipe_dist} F{speed}
        G1 X{start_x} F{speed}
    {% endfor %}

    # 4. Lift nozzle safely clear of brush
    G1 Z{clear_z} F1500
    RESTORE_GCODE_STATE NAME=voron_wipe_state MOVE=0

# Clean nozzle wrapper (canonical entry point)
[gcode_macro CLEAN_NOZZLE]
description: Scrub nozzle across the Voron decontaminator brush
gcode:
    RESUME_NOZZLE_WIPE_SEQUENCE

# Extrude purge volume (legacy alias routing to Blobifier)
[gcode_macro PURGE_IN_CHUNKS]
description: Legacy alias - delegates purge request directly to Blobifier
gcode:
    {% set purge_len = params.PURGELENGTH|default(50)|float %}
    {% if printer["gcode_macro BLOBIFIER"] is defined %}
        BLOBIFIER PURGE_LENGTH={purge_len}
    {% else %}
        M83
        G1 E{purge_len} F300
        G92 E0
    {% endif %}

# ============================================================================
# 6. SERVO WIPER STUBS (NO-OPS ON VORON)
# ============================================================================
# Voron uses a stationary brush and Blobifier tray. These stubs prevent
# errors in any scripts expecting Anycubic Kobra servo wiper macros.
[gcode_macro ZERO_OUT_SERVO]
gcode:
    # No servo wiper on Voron 2.4

[gcode_macro DEPLOY_SERVO_AT_THROW]
gcode:
    # No servo wiper on Voron 2.4

[gcode_macro SERVO_SHAKE]
gcode:
    # No servo wiper on Voron 2.4

# ============================================================================
# 7. PRE & POST TOOLCHANGE SEQUENCES
# ============================================================================

# Pre-toolchange hook: called before tool change begins
[gcode_macro _ACE_PRE_TOOLCHANGE]
description: Prepare toolhead, execute safe Z-hop, and move to rear position
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set target_temp = params.TARGET_TEMP|default(0)|int %}
    {% set current_temp = printer.extruder.temperature|float %}
    {% set current_target = printer.extruder.target|int %}

    { action_respond_info("ACE: Pre-toolchange sequence started") }

    # 1. Save and turn off part cooling fan during toolchange
    {% set current_fan = printer.fan.speed|default(0.0)|float %}
    {% set fan_pwm = (current_fan * 255)|int %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pre_toolchange_fan VALUE={fan_pwm}
    M106 S0

    # 2. Save current hotend target for restoration in post-toolchange
    {% set save_target = current_target if current_target > 0 else target_temp %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=orig_target VALUE={save_target}

    # 3. Save exact print location and gcode state before ANY toolchange motion
    {% set cur_x = printer.toolhead.position.x|float %}
    {% set cur_y = printer.toolhead.position.y|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z_hop = 3.0 %}
    {% set safe_lift = [cur_z + z_hop, z_max - 1.0]|min %}

    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=saved_x VALUE={cur_x}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=saved_y VALUE={cur_y}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=saved_z VALUE={cur_z}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=saved_zhop VALUE={safe_lift}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=has_saved_pos VALUE=1

    SAVE_GCODE_STATE NAME=ace_toolchange_state

    # 4. Safe Z-hop for Voron CoreXY flying gantry
    G90
    G1 Z{safe_lift} F1200

    # 5. Travel safely to cutter approach position (avoids cutter arm)
    TO_BLADE

    # 6. Maintain nozzle temperature
    {% set heat_temp = [save_target, target_temp, vars.default_nozzle_temp]|max %}
    {% if current_temp < heat_temp - 5 %}
        { action_respond_info("ACE: Heating nozzle to %d°C" % heat_temp) }
        M109 S{heat_temp}
    {% endif %}

# Post-toolchange hook: called after new filament has loaded to nozzle
[gcode_macro _ACE_POST_TOOLCHANGE]
description: Primary toolchange purge and cleaning sequence delegated exclusively to Blobifier
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set purge = params.PURGELENGTH|default(50)|float %}

    { action_respond_info("ACE: Post-toolchange sequence started") }

    # 1. Lift nozzle off Blobifier tray if parked on it
    {% if vars.stopper_enable|default(True)|lower == 'true' %}
        LIFT_FROM_STOPPER
    {% endif %}

    # 2. Execute Purge & Wipe Routine exclusively through Blobifier
    # Blobifier handles 100% of tray extension, pulsating blob extrusion,
    # exponential Z-raise, tray ejection, bucket tracking, and nozzle scrubbing.
    {% if printer["gcode_macro BLOBIFIER"] is defined %}
        { action_respond_info("ACE: Purging %.1fmm through Blobifier..." % purge) }
        BLOBIFIER PURGE_LENGTH={purge}
    {% else %}
        { action_respond_info("ACE: Blobifier macro not found! Falling back to brush scrub.") }
        CLEAN_NOZZLE
    {% endif %}

    # 3. Restore part cooling fan speed
    {% set st = printer["gcode_macro _ACE_STATE"] %}
    {% set saved_fan = st.pre_toolchange_fan|default(0)|int %}
    M106 S{saved_fan}

    # 4. Restore hotend printing temperature
    {% set orig_temp = st.orig_target|int %}
    {% if orig_temp > 0 %}
        M104 S{orig_temp}
    {% elif vars.idle_heater_off|lower == 'true' %}
        M104 S0
    {% endif %}

    # 5. Return toolhead to exact saved print position
    {% if st.has_saved_pos|int == 1 %}
        {% set speed_xy = vars.poop_x_speed|default(12000)|int %}
        { action_respond_info("ACE: Returning toolhead to print position (X%.2f Y%.2f Z%.2f)" % (st.saved_x, st.saved_y, st.saved_z)) }

        G90
        # Ensure nozzle is lifted to safe Z-hop height before traveling across bed
        {% if printer.toolhead.position.z < st.saved_zhop %}
            G1 Z{st.saved_zhop} F1500
        {% endif %}

        # Rapid move in XY directly above the saved print position
        G1 X{st.saved_x} Y{st.saved_y} F{speed_xy}

        # Lower Z back down to original layer height
        G1 Z{st.saved_z} F1500

        # Restore gcode state (speed factor, coordinate modes, extrusion state)
        RESTORE_GCODE_STATE NAME=ace_toolchange_state MOVE=0
        SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=has_saved_pos VALUE=0
    {% endif %}

    { action_respond_info("ACE: Post-toolchange sequence completed") }

# Retraction preparation hook: called by KLIPPACE before ACE rewinds filament
[gcode_macro _ACE_PREPARE_FOR_RETRACTION]
description: Heat nozzle, cut tip, and park nozzle on Blobifier tray
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set target_temp = params.TARGET_TEMP|default(0)|int %}
    {% set pre_cut_retract = vars.pre_cut_retract_length|default(2)|float %}
    {% set current_temp = printer.extruder.temperature|float %}
    {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(190)|int %}

    # 1. Ensure nozzle is sufficiently hot for clean cut and retraction
    {% if current_temp < min_extrude %}
        {% set heat_to = [target_temp, min_extrude + 10]|max %}
        { action_respond_info("ACE: Heating to %d°C for clean tip cut" % heat_to) }
        M109 S{heat_to}
    {% endif %}

    # 2. Small pre-cut retraction to relieve melt pool pressure
    {% if pre_cut_retract > 0 %}
        M83
        G1 E-{pre_cut_retract} F600
        G92 E0
    {% endif %}

    # 3. Execute filament cut at gantry cutter pin
    CUT_TIP

    # 4. Rest nozzle on Blobifier tray to catch ooze while ACE swaps spools
    {% if vars.stopper_enable|default(True)|lower == 'true' %}
        BLOBIFIER_PARK
    {% endif %}

# ============================================================================
# 8. PRINT_START HOOK & MANUAL PARK UTILITIES
# ============================================================================

# Print Start initial tool loading hook
[gcode_macro ACE_ON_PRINT_START]
description: Ensure the requested initial tool is loaded and wiped before printing starts
variable_requested_tool: 0
gcode:
    {% set tool = params.INITIAL_TOOL|default(0)|int %}
    {% set ace_enabled = printer["output_pin ACE_Pro"].value|default(1)|int %}

    {% if ace_enabled == 1 and tool >= 0 %}
        {% set current_tool = printer.save_variables.variables.ace_current_index|default(-1)|int %}
        {% set filament_pos = printer.save_variables.variables.ace_filament_pos|default('bowden') %}

        { action_respond_info("ACE: Ensuring Tool T%d is loaded for print start" % tool) }
        {% if current_tool == tool and filament_pos == 'nozzle' %}
            { action_respond_info("ACE: Tool T%d is already loaded in nozzle" % tool) }
        {% else %}
            T{tool}
        {% endif %}
        # Clean nozzle on brush after initial load
        BLOBIFIER_CLEAN
    {% endif %}

# Retract single slot back to park position before 4-in-1 splitter (400mm)
[gcode_macro PARK_SLOT]
description: Retract a slot back to its park position before the splitter (400mm)
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    {% set length = params.LENGTH|default(400)|int %}
    ACE_PARK_SLOT SLOT={slot} LENGTH={length}

# Retract all loaded slots back to park position before 4-in-1 splitter (400mm)
[gcode_macro PARK_ALL_SLOTS]
description: Retract all loaded spools back to their park positions before the splitter (400mm)
gcode:
    {% set length = params.LENGTH|default(400)|int %}
    ACE_PARK_ALL_SLOTS LENGTH={length}

# ============================================================================
# 9. FILAMENT DRYER MACROS (ACE Pro Drying Chamber)
# ============================================================================
[gcode_macro DRYER_START]
description: Start ACE Pro filament dryer with target temperature and duration
gcode:
    {% set max_temp = printer.configfile.settings.ace.max_dryer_temperature|default(65)|int %}
    {% set duration = params.DURATION|default(240)|int %}
    {% set material = params.MATERIAL|default("")|string|upper %}
    {% set req_temp = params.TEMP|default(0)|int %}

    # Determine temperature from material if TEMP is not explicitly passed
    {% if req_temp > 0 %}
        {% set target_temp = req_temp %}
    {% elif "PLA" in material %}
        {% set target_temp = 45 %}
    {% elif "PETG" in material or "TPU" in material %}
        {% set target_temp = 50 %}
    {% elif "ABS" in material or "ASA" in material %}
        {% set target_temp = 55 %}
    {% elif "PA" in material or "NYLON" in material or "PC" in material %}
        {% set target_temp = 60 %}
    {% else %}
        {% set target_temp = 50 %}
    {% endif %}

    # Clamp to configured safety limit (default max 65°C)
    {% set final_temp = [target_temp, max_temp]|min %}

    { action_respond_info("ACE: Starting filament dryer at %d°C for %d min (material=%s)" % (final_temp, duration, material if material else "custom")) }
    ACE_START_DRYING TEMP={final_temp} DURATION={duration}

[gcode_macro DRYER_STOP]
description: Stop the ACE Pro filament dryer
gcode:
    { action_respond_info("ACE: Stopping filament dryer") }
    ACE_STOP_DRYING

