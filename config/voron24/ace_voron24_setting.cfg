# ============================================================================
# KLIPPACE - ACE Pro Driver Settings for Voron 2.4 (350mm)
# ============================================================================
# Calibrated for:
#   - ACE Placement:       On top of printer
#   - ACE to 4-in-1:       ~150mm PTFE tubes
#   - 4-in-1 to Toolhead:  ~800-900mm PTFE tube (~850mm nominal)
#   - Total Distance:      ~1000-1050mm (ACE parking position to toolhead sensor)
#   - Primary Sensor:      EBB:PD0 (filament_entry_sensor, just before extruder)
#   - Secondary Sensor:    EBB:PA15 (filament_nozzle_sensor, at nozzle)
#   - RDM Buffer:          None (toolhead-only mode)
# ============================================================================

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

# Virtual pins for toggling features from Mainsail / Fluidd UI
[virtual_pins]

[output_pin ACE_Pro]
pin: virtual_pin:ace_pro
pwm: False
value: 1
shutdown_value: 0

[output_pin AUTO_UNLOAD]
pin: virtual_pin:auto_unload
pwm: False
value: 1
shutdown_value: 0

[output_pin bed_mesh_adaptive]
pin: virtual_pin:bed_mesh_adaptive_pin
value: 1          # 1 = adaptive mesh enabled, 0 = full mesh

[respond]

[ace]
ace_count: 1          # Set to 2 if you have 2 ACE Pro units chained
baud: auto            # auto = 115200 for ACE1, 230400 for ACE2
protocol: auto        # auto-detect from connected USB device

# --- Dual Sensor Configuration (EBB36 Toolhead) ---
# Entry sensor (PD0, above extruder drive gears):
filament_runout_sensor_name_entry: filament_entry_sensor
# Nozzle sensor (PA15, below extruder drive gears at hotend):
filament_runout_sensor_name_nozzle: filament_nozzle_sensor
# Maximum safety distance from entry sensor to nozzle sensor (mm):
max_entry_to_nozzle_length: 80
# No sensor between ACE and toolhead (passive 4-in-1 splitter, toolhead-only mode):
# filament_runout_sensor_name_rdm: None

# Default state of feed-assist after ACE connect/re-connect
feed_assist_active_after_ace_connect: True

# --- Feeding Speeds ---
feed_speed: 60
retract_speed: 50

# Automated park retraction on spool insertion (Path A for 150mm splitter tubes):
# The ACE hardware feeds ~500-550mm on initial grab. Once the slot reports ready,
# KLIPPACE automatically rewinds 400mm so the tip stops ~100-150mm from the ACE,
# safely parked ~50mm before the 4-in-1 splitter so other slots can feed freely.
spool_load_park_retract_length: 400
spool_load_park_retract_speed: 50

# Maximum feeding distance safety limit (triggers pause if sensor never trips)
total_max_feeding_length: 1500

# Tube length from ACE parking position to toolhead entry sensor.
# Retraction pulls back this full distance + retract_length during toolchange,
# safely clearing the 4-in-1 splitter so the path is open for the next spool:
parkposition_to_toolhead_length: 1050

# Fast-feed distance when loading a new tool before slowing down near the toolhead:
toolchange_load_length: 850

# Distance filament feeds in single-sensor fallback mode:
extruder_feeding_length: 35
# Speed (mm/s) for coordinated ACE push and extruder stepping into the gears and nozzle sensor:
extruder_feeding_speed: 8

# Retraction from nozzle cold zone before cutting
toolhead_retraction_length: 25
toolhead_retraction_speed: 15

# Distance to push filament from extruder gears through the melt zone to prime the nozzle:
toolhead_full_purge_length: 50
toolhead_slow_loading_speed: 5

# Purge parameters during tool change
default_color_change_purge_length: 50
default_color_change_purge_speed: 300
purge_max_chunk_length: 200
purge_multiplier: 1.0

# Small retraction before moving to cutter pin
pre_cut_retract_length: 2

# Debounce sensor noise (3 readings ≈ 150ms)
runout_debounce_count: 3

# --- Moonraker Lane Data Sync (OrcaSlicer filament info sync) ---
moonraker_lane_sync_enabled: True
moonraker_lane_sync_url: http://127.0.0.1:7125
moonraker_lane_sync_namespace: lane_data
moonraker_lane_sync_timeout: 2.0
moonraker_lane_sync_unknown_material_mode: empty
moonraker_lane_sync_unknown_material_markers: ???,unknown,n/a,none
moonraker_lane_sync_unknown_material_map_to: PLA

max_dryer_temperature: 65

# Required registration for ACE dryer heater
[temperature_ace]
