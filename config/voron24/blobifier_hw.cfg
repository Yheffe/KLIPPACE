# ============================================================================
# BLOBIFIER HARDWARE CONFIGURATION - VORON 2.4 (350mm) + BTT OCTOPUS MAX EZ
# ============================================================================
# Physical connections on BIGTREETECH Octopus Max EZ:
#   - Servo Motor: Dedicated SERVO port (Signal: PE9, 5V, GND)
#   - Bucket Sensor (Optional): Microswitch on PG12
# ============================================================================

[servo blobifier]
pin: PE9
maximum_servo_angle: 180
minimum_pulse_width: 0.0005     # 0.5ms (standard MG90S / SG90 servo)
maximum_pulse_width: 0.0025     # 2.5ms
initial_angle: 180              # Resting / retracted tray position (inside base)

# ----------------------------------------------------------------------------
# BUCKET SENSOR (OPTIONAL)
# ----------------------------------------------------------------------------
# Uncomment if your Blobifier bucket includes an optical switch or microswitch
# to detect when the purge bucket is full or missing.
#[filament_switch_sensor blobifier_bucket]
#switch_pin: ^PG12
#pause_on_runout: True
#runout_gcode:
#    M118 Blobifier: Purge bucket is full or removed! Empty bucket and resume.
#    PAUSE
#insert_gcode:
#    M118 Blobifier: Purge bucket replaced. Ready to resume.
