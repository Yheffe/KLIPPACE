# ============================================================================
# BIGTREETECH EBB36 GEN2 TOOLHEAD BOARD CONFIGURATION
# ============================================================================
# Board:             BTT EBB36 GEN2 (STM32G0B1, 8MHz crystal)
# Connection:        USB (/dev/serial/by-id/usb-Klipper_stm32g0b1xx_...)
# Toolhead Type:     A4T ([A]nother [4]010 [T]oolhead) with Crossbow Cutter
# Extruder:          WristWatch BMG (WW BMG, 50:17 gear ratio)
# Multi-Material:    Managed via KLIPPACE (ace_voron24_hardware.cfg)
# ============================================================================

# ----------------------------------------------------------------------------
# MCU DEFINITION
# ----------------------------------------------------------------------------
[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5B002C000650505539323520-if00

# ----------------------------------------------------------------------------
# ONBOARD ACCELEROMETER (Input Shaping)
# ----------------------------------------------------------------------------
[lis2dw]
cs_pin: EBB:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x, y, z

# ============================================================================
# EXTRUDER & MOTOR DRIVER
# ============================================================================
[extruder]
step_pin: EBB:PB14
dir_pin: !EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 22.6789511      # Calibrated rotation distance
gear_ratio: 50:17                  # WristWatch BMG (WW BMG, 50:17)
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: PT1000                # PT1000 RTD sensor
pullup_resistor: 2200              # Onboard 2.2K pullup resistor
sensor_pin: EBB:PA3
control: pid
pid_Kp: 24.485
pid_Ki: 2.093
pid_Kd: 71.623
min_temp: 0
max_temp: 300
max_extrude_cross_section: 5.0
max_extrude_only_accel: 3000
max_extrude_only_velocity: 60
max_extrude_only_distance: 200.0   # Allow long purge & prime moves

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.650
stealthchop_threshold: 999999

# ============================================================================
# TOOLHEAD FANS
# ============================================================================

# Part Cooling Fan (A4T toolhead fan)
[fan]
pin: EBB:PD3
max_power: 0.50

# Hotend Heatsink Fan (3010 fan with tachometer feedback)
[heater_fan hotend_fan]
pin: EBB:PD2
heater: extruder
heater_temp: 50.0
tachometer_pin: EBB:PA4

# ============================================================================
# TOOLHEAD RGB LIGHTING
# ============================================================================
[neopixel hotend_rgb]
pin: EBB:PC7
chain_count: 3                     # 1 logo LED + 2 nozzle LEDs
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

# ============================================================================
# MULTI-MATERIAL FILAMENT SENSORS
# ============================================================================
# The filament sensors on this toolhead are managed by KLIPPACE:
#   - EBB:PD0  -> filament_entry_sensor  (Entry switch before extruder gears)
#   - EBB:PA15 -> filament_nozzle_sensor (Lower switch at nozzle / melt zone)
#
# These are configured in: config/voron24/ace_voron24_hardware.cfg
# ============================================================================
