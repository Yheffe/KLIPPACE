[include ace_voron24.cfg]


##############################################################
#
#   BTT OCTOPUS MAX EZ CFG FOR VORON 2.4R2
#
##############################################################
# This file contains common pin mappings for the BIGTREETECH Octopus Max EZ.
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PD0/PD1)".
##############################################################
#   CONFIGS TO INCLUDE
##############################################################
[include mainsail.cfg]
[include timelapse.cfg]
[include ebb36_gen2.cfg]
[include sensorless_homing.cfg]
#[include mmu_cut_tip.cfg]
##############################################################
#   ENABLED FUNCTIONS
##############################################################
[exclude_object]

[firmware_retraction]

[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True
##############################################################
#   MCUs
##############################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_1B0017001051313236343430-if00
#canbus_uuid: b42bed1a1d67
#
#[mcu MMB]
#canbus_uuid: 5c5400ac5f7d
##############################################################
#   KINEMATICS
##############################################################
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4000    			#Max 4000
max_z_velocity: 15 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[neopixel Chamber_Lighting]
pin: PE10
chain_count: 25
# Number of LEDs
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0
##############################################################
#   X-AXIS
##############################################################
# Motor-1
[stepper_x]
step_pin: PE4
dir_pin: !PE5
enable_pin: !PE3
microsteps: 32
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 355
position_max: 355
homing_speed: 80
homing_positive_dir: true
##############################################################
#   Y-AXIS
##############################################################
# Motor-2
[stepper_y]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PE6
microsteps: 32
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 360
position_max: 360
homing_speed: 80
homing_positive_dir: true
##############################################################
#   Z0      FRONT LEFT
##############################################################
# Motor-3
[stepper_z]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16
position_min: -5
position_max: 230
homing_speed: 50
endstop_pin: probe:z_virtual_endstop
##############################################################
#   Z1      REAR LEFT
##############################################################
# Motor-4
[stepper_z1]
step_pin: PB8
dir_pin: PB9
enable_pin: !PB7
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16
##############################################################
#   Z2      REAR RIGHT
##############################################################
# Motor-5
[stepper_z2]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
microsteps: 16
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16
##############################################################
#   Z3      FRONT RIGHT
##############################################################
# Motor-6
[stepper_z3]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16
##############################################################
#           PROBE
##############################################################
[probe]
pin: EBB:PB8
x_offset: 0
y_offset: 0
#z_offset: 0
speed: 5.0
samples: 2
lift_speed: 50
samples_result: median
sample_retract_dist: 4.0
samples_tolerance: 0.016
samples_tolerance_retries: 3

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
##############################################################
#   BED HEATER
##############################################################
[heater_bed]
heater_pin: PF6
sensor_pin: PB1 # TB
sensor_type: Generic 3950
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769
pwm_cycle_time: 0.01666
min_temp: 0
max_temp: 120
max_power: 0.85
##############################################################
#   FANS
##############################################################
[controller_fan Nevermore]
pin: PA4
max_power: 0.75
off_below: 0.10
heater: heater_bed

[controller_fan Power_Supply]
pin: PA6
max_power: 0.3
off_below: 0.10
kick_start_time: 0.5
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z

[controller_fan Controller_Fan]
pin: PA5
max_power: 0.5
off_below: 0.10
kick_start_time: 0.5
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z
##############################################################
#   THERMALS
##############################################################
[temperature_sensor Raspberry_Pi_4B]
sensor_type: temperature_host
max_temp: 100

[temperature_sensor Octopus_Max_EZ]
sensor_type: temperature_mcu
max_temp: 100

[temperature_sensor EBB36_GEN2]
sensor_type: temperature_mcu
sensor_mcu: EBB
max_temp:100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PB0
##############################################################
#   STEPPER CONFIGURATION
##############################################################
[tmc2209 stepper_x]
uart_pin: PG13
interpolate: false
diag_pin: PF2
driver_SGTHRS: 60
run_current: 0.800
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PG14
interpolate: false
diag_pin: PF0
driver_SGTHRS: 120
run_current: 0.800
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PG12
#diag_pin: PF4
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PG11
#diag_pin: PF3
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z2]
uart_pin: PG10
#diag_pin:
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z3]
uart_pin: PG9
#diag_pin:
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

##############################################################
#   HOMING AND GANTRY ADJUSTMENTS
##############################################################
[idle_timeout]
timeout: 36000

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
home_xy_position: 177.5,180
z_hop:10

[bed_mesh]
speed: 300
horizontal_move_z: 10
probe_count: 20,20
algorithm: bicubic
mesh_min: 25,35
mesh_max: 325,350

[quad_gantry_level]
##  Gantry Corners for 350mm Build

gantry_corners:
   -60,-10
   415,420
##  Probe points
points:
   50,25
   50,315
   305,315
   305,25

#--------------------------------------------------------------------
speed: 500
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.0075
max_adjust: 10
    
##############################################################
#   MACROS
##############################################################
#####################################################################
#   print_start macro
#####################################################################
#####################################################################
#   A better print_start macro for v2
#####################################################################


[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # Home the printer, set absolute positioning.
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute position

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
  #  M106 S255                                           # Turn on the PT-fan
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
  M190 S{target_bed}                                  # Set the target temp for the bed
  TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
  M190 S{target_bed}                                  # Set the target temp for the bed
  G4 P300000                                          # Wait 5 min for the bedtemp to stabilize
  {% endif %}

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  M109 S150                                             # Heat hotend to 150c
  CLEAN_NOZZLE
  
  ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  G28 Z                                                # Home Z again after QGL

  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  BED_MESH_CALIBRATE ADAPTIVE=1                          # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh

  # Heat up the hotend up to target via data from slicer
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp

  # --- ACE Pro Initial Tool Load Hook ---
  {% if params.INITIAL_TOOL is defined %}
    ACE_ON_PRINT_START INITIAL_TOOL={params.INITIAL_TOOL|int}
  {% endif %}

  LINE_PURGE


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    #BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 108
variable_start_y: 350
variable_start_z: 6.0
variable_wipe_dist: 50
variable_wipe_qty: 10
variable_wipe_spd: 200
variable_raise_distance: 30

gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}
 
 G90                                            ; absolute positioning
 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 Z{raise_distance}

# Note: CUT_TIP is now provided by ace_voron24_macros.cfg with identical
# coordinates (X0 Y340 -> X0 Y359 -> retract 10mm -> X0 Y330).
# The local definition below is commented out to prevent duplicate macro errors:
# [gcode_macro CUT_TIP]
# description: Move toolhead to far left to cut filament
# gcode:
#  M118 Initiaing Filament Cut
#  ... (see ace_voron24_macros.cfg)

[gcode_macro ADAPTIVE_PURGE]
gcode:
    # Get bounding box variables from the slicer (defaults to bed edge if missing)
    {% set area_min_x = params.AREA_MIN_X|default(10)|float %}
    {% set area_min_y = params.AREA_MIN_Y|default(10)|float %}
    
    # --- CONFIGURATION ---
    {% set purge_height = 0.30 %} 
    {% set purge_x = [area_min_x - 5, 5]|max %}
    {% set purge_y_start = [area_min_y, 10]|max %}
    {% set purge_y_end = purge_y_start + 45 %}    # 45mm line length
    
    G92 E0                                         # Reset Extruder
    M83                                            # Force relative extrusion mode
    
    # 1. TRAVEL TO START POSITION
    G1 Z2.0 F750                                   # Lift Z safely
    G1 X{purge_x} Y{purge_y_start} Z2.0 F5000.0     # Travel to start XY coordinates (Adjusted to F5000)
    G1 Z{purge_height} F500                        # Drop down to purge height
    
    # 2. ADD AN INTRO NOZZLE BLOB (Anchors filament to the bed)
    G1 E20 F150                                   # Extrude a small 4mm blob in place
    G4 P500                                        # Dwell for 500ms to let it stick
    
    # 3. DRAW PURGE LINES
    G1 X{purge_x} Y{purge_y_end} Z{purge_height} F275.0 E70.0        # Line 1
    G1 X{purge_x + 0.75} Y{purge_y_end} Z{purge_height} F1250.0        # Move over 0.75mm
    G1 X{purge_x + 0.75} Y{purge_y_start} Z{purge_height} F350.0 E75.0 # Line 2
    
    # 4. RETRACTION STEP (Prevents oozing while moving to the print)
    G1 E-1.5 F1800                                 # Retract 1.5mm of filament quickly
    G92 E0                                         # Reset Extruder
    
    # 5. NOZZLE WIPE & SNAP
    G1 Z1.0 F750                                   # Lift slightly to clear the line
    G1 X{purge_x + 15} Y{purge_y_start - 5} F4000.0 # Rapid diagonal wipe to break the string
    G92 E0                                         # Final extruder reset



