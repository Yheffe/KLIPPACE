# ============================================================================
# BLOBIFIER - OFFICIAL PURGE TRAY & SERVO BUCKET ROUTINE (v1.5)
# ============================================================================
# Based on the official Blobifier project by Dendrowen (Carrot-collective / Happy-Hare).
# Tailored for Voron 2.4R2 (350mm) + Anycubic ACE Pro + KLIPPACE.
#
# Hardware Layout Reference (Voron 350mm):
#   - A4T Crossbow Cutter Pin:   X0 Y359 (Approach: X0 Y340)
#   - Blobifier Purge/Park Tray: X5 Y360 Z3.5
#   - Decontaminator Brush:      X96 to X136, Y360, Z3.0 (Clearance: Z10.0)
#   - Servo Tray Movement:       PE9 (0° = OUT / extended, 180° = IN / retracted)
#   - Shaker Arm Engagement:     X5 Z2.5 (A4T toolhead shaker)
# ============================================================================

[include blobifier_hw.cfg]

# ============================================================================
# 1. BLOBIFIER CONFIGURATION VARIABLES
# ============================================================================
[gcode_macro _BLOBIFIER_VARS]
description: Configuration and tuning variables for official Blobifier suite

# ---------------------------------- Speeds ----------------------------------
variable_purge_spd: 400                      # Purge extrusion feedrate (mm/min = 6.7 mm/s)
variable_purge_temp_min: 190                 # Minimum nozzle temperature required to purge
variable_travel_spd_xy: 12000                # Travel move speed (mm/min)
variable_travel_spd_z: 1500                  # Z-axis travel move speed (mm/min)
variable_toolhead_x: 70                      # Distance from nozzle to left edge of toolhead
variable_toolhead_y: 50                      # Distance from nozzle to front edge of toolhead
variable_force_safe_descend_height_until: 1.0# Safety threshold for bed object clearance (mm)
variable_skew_correction: 0.0                # Bed skew compensation offset
variable_y_offset: 0.0                       # Y offset from axis_maximum.y (360 - 0 = 360)

# ----------------------------- Tray Geometry --------------------------------
variable_purge_x: 5.0                        # X coordinate of Blobifier tray surface
variable_purge_y: 360.0                      # Y coordinate of Blobifier tray surface
variable_tray_top: 3.5                       # Z height at tray surface
variable_blobifier_type: "servo"             # "servo" or "stepper"
variable_servo_name: "blobifier"             # Name of [servo] section in blobifier_hw.cfg
variable_tray_angle_out: 0                   # Tray extended under nozzle (0° = OUT)
variable_tray_angle_in: 180                  # Tray retracted inside housing (180° = IN)
variable_dwell_time: 400                     # Dwell time (ms) for servo travel before PWM cutoff

# ----------------------------- Brush & Cleaning -----------------------------
variable_brush_start: 96.0                   # Start X of decontaminator brush
variable_brush_width: 40.0                   # Brush width along X (X96 to X136)
variable_brush_top: 3.0                      # Z height inside brush bristles
variable_clearance_z: 7.0                    # Clearance above brush top (3.0 + 7.0 = 10.0mm)
variable_brush_y_offset: 0.0                 # Brush Y offset (360 - 0 = 360)
variable_brush_accel: 0                      # Brush scrub acceleration (0 = default printer accel)
variable_wipe_qty: 3                         # Number of back-and-forth wipe passes
variable_wipe_spd_xy: 12000                  # Scrub travel speed (mm/min)
variable_clean_macro: "BLOBIFIER_CLEAN"      # Macro called after blob ejection

# ------------------------ Blob Formation & Pulsing --------------------------
variable_purge_start: 0.5                    # Height above tray (mm) before starting extrusion
variable_z_raise: 10.0                       # Total Z lift per blob during extrusion
variable_z_raise_exp: 0.85                   # Exponential curve for Z raise (0.5 ... 1.0)
variable_eject_hop: 10.0                     # Z lift (mm) before retracting tray
variable_pressure_release_time: 600          # Dwell (ms) after extrusion to release pressure
variable_retract_between_blobs: 6.0          # Filament retraction between split blobs (mm)
variable_retract_step: 2.0                   # Retract step size (mm)
variable_pulse_retract_length: 3.0           # Periodic pulse retraction (mm) to break laminar flow
variable_pulse_retract_speed: 2400           # Pulse retraction speed (mm/min = 40 mm/s)
variable_pulse_deretract_speed: 900          # Pulse de-retract speed (mm/min = 15 mm/s)
variable_purge_pulse_size: 8.0               # Chunk size per pulse (mm)
variable_purge_retract_interval: 20.0        # Interval (mm) between pulse retractions

# ------------------------------- Fan Control --------------------------------
variable_part_cooling_fan: 0.2               # Fan speed during purge (0..1, -1 = unchanged)
variable_part_cooling_fan_blob_deposit: 1.0  # Fan speed during blob deposit / eject (1.0 = 100%)
variable_fan_name: ""                        # Custom fan name (leave empty for default [fan])

# ----------------------- Purge Length & Slicer Tuning -----------------------
variable_purge_length: 50.0                  # Default fallback purge length (mm)
variable_purge_length_minimum: 20.0          # Minimum required purge to prime nozzle
variable_purge_length_maximum: 100.0         # Max filament per blob before splitting into multiple
variable_purge_length_modifier: 1.0          # Scaling factor for slicer purge volume
variable_purge_length_addition: 0.0          # Additional filament length (mm)
variable_include_extruder_residual: 0

# ----------------------------- Bucket & Shaker ------------------------------
variable_max_blobs: 350                      # Maximum blobs before bucket full pause
variable_enable_shaker: 1                    # Enable bucket shaker arm
variable_shaker_pos_x: 5.0                   # Shaker X engagement position (at tray/bucket)
variable_shaker_arm_z: 2.5                   # Shaker Z height (calibrated for A4T toolhead)
variable_bucket_shakes: 8                    # Number of back-and-forth shakes
variable_shake_accel: 8000                   # Shake acceleration
variable_bucket_shake_frequency: 0.80        # Frequency factor for bucket shaking

# --------------------------- Hooks & Extensions -----------------------------
variable_user_pre_blobifier_extension: ""
variable_user_post_purge_extension: ""
variable_user_post_blobifier_extension: ""

gcode:
    # Storage container for variables only


# ============================================================================
# 2. MAIN BLOBIFIER MACRO
# ============================================================================
[gcode_macro BLOBIFIER]
description: Primary purge macro - builds compact blobs, ejects via servo tray, and scrubs nozzle
variable_initialized: 1
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}

    # 1. User pre-blobifier extension hook
    {% if bl.user_pre_blobifier_extension %}
        {bl.user_pre_blobifier_extension}
    {% endif %}

    # 2. Verify homing status
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("BLOBIFIER: Printer not homed! Home XYZ before blobbing.") }
    {% endif %}
    {% if printer.quad_gantry_level and printer.quad_gantry_level.applied == False %}
        { action_raise_error("BLOBIFIER: QGL not applied! Run QUAD_GANTRY_LEVEL first.") }
    {% endif %}

    # 3. Save motion and hardware states
    SAVE_GCODE_STATE NAME=blobifier_state

    # Save part cooling fan speed
    {% set fan_obj = printer[bl.fan_name] if bl.fan_name and printer[bl.fan_name] is defined else printer.fan %}
    {% set backup_fan_speed = fan_obj.speed|default(0.0)|float %}

    # Set part cooling fan during purge
    {% if bl.part_cooling_fan >= 0 %}
        M106 S{(bl.part_cooling_fan * 255)|int}
    {% endif %}

    # Feedrate to 100%
    {% set backup_feedrate = printer.gcode_move.speed_factor %}
    M220 S100

    # Pressure advance zeroed during purge
    {% set backup_pa = printer.extruder.pressure_advance|default(0.0)|float %}
    SET_PRESSURE_ADVANCE ADVANCE=0

    # 4. Geometry and coordinate calculations
    {% set pos = printer.gcode_move.gcode_position %}
    {% set restore_z = [printer['gcode_macro BLOBIFIER_PARK'].restore_z|default(0)|float, pos.z]|max %}
    {% set pos_max = printer.toolhead.axis_maximum %}
    {% set position_y = bl.purge_y|default(pos_max.y - bl.skew_correction - bl.y_offset)|float %}
    {% set safe = printer['gcode_macro _BLOBIFIER_SAFE_DESCEND'] %}
    {% set ignore_safe = safe.print_height < bl.force_safe_descend_height_until %}

    # 5. Determine total purge length
    {% set filament_diameter = printer.configfile.config.extruder.filament_diameter|default(1.75)|float %}
    {% set filament_cross_section = (filament_diameter / 2.0) ** 2 * 3.14159265 %}

    {% if params.PURGE_LENGTH %}
        {% set raw_purge = params.PURGE_LENGTH|float %}
        {% set purge_len = (raw_purge * bl.purge_length_modifier + bl.purge_length_addition)|round(1) %}
    {% elif printer.mmu is defined and printer.mmu.slicer_tool_map is defined and printer.mmu.slicer_tool_map.purge_volumes %}
        {% set from_tool = printer.mmu.last_tool|default(-1)|int %}
        {% set to_tool = printer.mmu.tool|default(-1)|int %}
        {% set pv = printer.mmu.slicer_tool_map.purge_volumes %}
        {% if from_tool >= 0 and to_tool >= 0 and pv[from_tool] is defined and pv[from_tool][to_tool] is defined %}
            {% set purge_vol = pv[from_tool][to_tool]|float * bl.purge_length_modifier %}
        {% else %}
            {% set purge_vol = pv|map('max')|max|float * bl.purge_length_modifier %}
        {% endif %}
        {% set purge_len = (purge_vol / filament_cross_section + bl.purge_length_addition)|round(1) %}
    {% else %}
        {% set purge_len = bl.purge_length|float %}
    {% endif %}

    # Apply minimum purge guarantee
    {% set purge_len = [purge_len, bl.purge_length_minimum]|max %}
    { action_respond_info("BLOBIFIER: Purging %.1fmm of filament" % purge_len) }

    # 6. Execute Purge Routine
    G90
    {% if purge_len > 0 %}
        # Retract tray before initial travel
        BLOBIFIER_SERVO POS=in

        # Approach rear position safely
        {% if printer.toolhead.position.y != position_y %}
            G1 X{[bl.brush_start - 20, 30]|max} Y{position_y} F{bl.travel_spd_xy}
        {% endif %}

        # Bucket shaker check
        {% set bl_count = printer['gcode_macro _BLOBIFIER_COUNT'] %}
        {% if bl.enable_shaker and (safe.shake or ignore_safe) %}
            {% if (bl_count.current_blobs + 1) >= bl_count.next_shake and bl_count.next_shake > 0 %}
                BLOBIFIER_SHAKE_BUCKET SHAKES={bl.bucket_shakes}
                _BLOBIFIER_CALCULATE_NEXT_SHAKE
            {% endif %}
        {% endif %}

        # Lower to tray approach height
        {% if safe.tray or ignore_safe %}
            G1 Z{bl.tray_top + bl.purge_start} F{bl.travel_spd_z}
        {% endif %}

        # Move over tray surface
        G1 X{bl.purge_x} Y{position_y} F{bl.travel_spd_xy}

        # Extend tray under nozzle
        BLOBIFIER_SERVO POS=out

        # Verify hotend temperature
        {% if printer.extruder.temperature < bl.purge_temp_min %}
            {% if printer.extruder.target < bl.purge_temp_min %}
                M109 S{bl.purge_temp_min}
            {% else %}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={bl.purge_temp_min}
            {% endif %}
        {% endif %}

        # Calculate blob splitting
        {% set blobs = ((purge_len / bl.purge_length_maximum) + 0.999)|int %}
        {% set purge_per_blob = (purge_len / blobs)|round(1) %}
        {% set pulses_per_blob = ((purge_per_blob / bl.purge_pulse_size) + 0.999)|int %}
        {% set purge_per_pulse = purge_per_blob / pulses_per_blob %}
        {% set pulse_duration = purge_per_pulse / (bl.purge_spd / 60.0) %}
        {% set pulses_per_retract = ((bl.purge_retract_interval / bl.purge_pulse_size) + 0.999)|int %}

        # Iterate through each blob
        {% for blob_idx in range(blobs) %}
            { action_respond_info("BLOBIFIER: Forming blob %d of %d (%.1fmm)..." % (blob_idx + 1, blobs, purge_per_blob)) }

            {% if safe.tray or ignore_safe %}
                G1 Z{bl.tray_top + bl.purge_start} F{bl.travel_spd_z}
            {% endif %}

            G91
            M83

            # De-retract before subsequent blobs
            {% if not loop.first and bl.retract_between_blobs > 0 %}
                G1 E{bl.retract_between_blobs} F{bl.pulse_deretract_speed}
            {% endif %}

            # Pulsating extrusion with exponential Z-raise
            {% for pulse in range(pulses_per_blob) %}
                {% set purged_this_blob = pulse * purge_per_pulse %}
                {% set z_last_pos = bl.purge_start + ((purged_this_blob) / bl.purge_length_maximum) ** bl.z_raise_exp * bl.z_raise %}
                {% set z_pos = bl.purge_start + ((purged_this_blob + purge_per_pulse) / bl.purge_length_maximum) ** bl.z_raise_exp * bl.z_raise %}
                {% set z_up = [z_pos - z_last_pos, 0.01]|max %}
                {% set pulse_spd = [(z_up / pulse_duration * 60.0), 300]|max %}

                # Primary pulse extrusion
                __BLOBIFIER_EXTRUDER_MOVE EXTRUDER_SPEED={pulse_spd} E={purge_per_pulse * 0.90} NEW_Z={z_up * 0.85}
                # Micro dwell / trailing flow
                __BLOBIFIER_EXTRUDER_MOVE EXTRUDER_SPEED={pulse_spd * 0.5} E={purge_per_pulse * 0.10} NEW_Z={z_up * 0.15}

                # Periodic retract and de-retract to disrupt laminar core flow
                {% if pulses_per_retract > 0 and (pulse + 1) % pulses_per_retract == 0 and not loop.last %}
                    __BLOBIFIER_EXTRUDER_MOVE E=-{bl.pulse_retract_length} EXTRUDER_SPEED={bl.pulse_retract_speed}
                    __BLOBIFIER_EXTRUDER_MOVE E={bl.pulse_retract_length} EXTRUDER_SPEED={bl.pulse_deretract_speed}
                {% endif %}
            {% endfor %}

            # Anti-ooze snap retraction after blob completes
            {% if loop.last %}
                __BLOBIFIER_EXTRUDER_MOVE E=-1.5 EXTRUDER_SPEED=1800
            {% else %}
                __BLOBIFIER_EXTRUDER_MOVE E=-{bl.retract_between_blobs} EXTRUDER_SPEED={bl.pulse_retract_speed}
            {% endif %}

            # Blob ejection sequence
            {% if safe.tray or ignore_safe %}
                # Boost fan for rapid solidification
                {% if bl.part_cooling_fan_blob_deposit >= 0 %}
                    M106 S{(bl.part_cooling_fan_blob_deposit * 255)|int}
                {% endif %}

                # Lift off blob
                G90
                G1 Z{bl.eject_hop} F{bl.travel_spd_z}

                # Retract tray inside housing to strip/drop blob
                BLOBIFIER_SERVO POS=in
                G1 Z{bl.tray_top} F{bl.travel_spd_z}

                # Dwell to release melt pressure
                M400
                G4 P{bl.pressure_release_time}

                # Tray strip cycle
                BLOBIFIER_SERVO POS=out
                BLOBIFIER_SERVO POS=in
                BLOBIFIER_SERVO POS=out

                # Increment blob counter
                _BLOBIFIER_COUNT

                # Restore purge fan speed
                {% if bl.part_cooling_fan >= 0 %}
                    M106 S{(bl.part_cooling_fan * 255)|int}
                {% else %}
                    M106 S{(backup_fan_speed * 255)|int}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}

    # 7. Nozzle scrubbing across brush
    {% if safe.tray or ignore_safe %}
        G1 Z{bl.tray_top + 1.0} F{bl.travel_spd_z}
    {% endif %}
    {% if bl.clean_macro %}
        {bl.clean_macro}
    {% endif %}

    # User post-purge extension hook
    {% if bl.user_post_purge_extension %}
        {bl.user_post_purge_extension}
    {% endif %}

    # 8. Safe retract tray and restore toolhead state
    BLOBIFIER_SERVO POS=in
    G90
    G1 Z{restore_z} F{bl.travel_spd_z}

    # Restore fan speed
    M106 S{(backup_fan_speed * 255)|int}

    # Restore feedrate
    M220 S{(backup_feedrate * 100)|int}

    # Restore pressure advance
    SET_PRESSURE_ADVANCE ADVANCE={backup_pa}

    RESTORE_GCODE_STATE NAME=blobifier_state

    # User post-blobifier extension hook
    {% if bl.user_post_blobifier_extension %}
        {bl.user_post_blobifier_extension}
    {% endif %}


# ============================================================================
# 3. HELPER & UTILITY MACROS
# ============================================================================

[gcode_macro __BLOBIFIER_EXTRUDER_MOVE]
description: Low-level extrusion helper with optional Z coordinate
gcode:
    {% set extruder_speed = params.EXTRUDER_SPEED|default(400)|float %}
    {% set E = params.E|float %}
    {% set new_z = params.NEW_Z|default(None) %}

    {% if new_z is not none %}
        G1 Z{new_z} E{E} F{extruder_speed}
    {% else %}
        G1 E{E} F{extruder_speed}
    {% endif %}

[gcode_macro BLOBIFIER_SERVO]
description: Move Blobifier tray between in (retracted/eject) and out (extended/purge) positions
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    {% set pos = params.POS|default("in")|lower %}

    {% if pos == "out" %}
        SET_SERVO SERVO={bl.servo_name} ANGLE={bl.tray_angle_out}
    {% else %}
        SET_SERVO SERVO={bl.servo_name} ANGLE={bl.tray_angle_in}
    {% endif %}
    G4 P{bl.dwell_time}
    SET_SERVO SERVO={bl.servo_name} WIDTH=0

[gcode_macro BLOBIFIER_SERVO_DEPLOY]
description: Extend Blobifier tray under nozzle (POS=out)
gcode:
    BLOBIFIER_SERVO POS=out

[gcode_macro BLOBIFIER_SERVO_RETRACT]
description: Retract Blobifier tray inside base to eject blob (POS=in)
gcode:
    BLOBIFIER_SERVO POS=in

[gcode_macro BLOBIFIER_CLEAN]
description: Scrub nozzle across the Voron decontaminator brush
gcode:
    {% if printer["gcode_macro CLEAN_NOZZLE"] is defined %}
        CLEAN_NOZZLE
    {% else %}
        {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
        {% set pos_max = printer.toolhead.axis_maximum %}
        {% set brush_y = pos_max.y - bl.skew_correction - bl.brush_y_offset %}
        {% set min_z = bl.brush_top + bl.clearance_z %}

        SAVE_GCODE_STATE NAME=blobifier_clean_state
        G90
        {% if printer.toolhead.position.z < min_z %}
            G1 Z{min_z} F{bl.travel_spd_z}
        {% endif %}
        G1 X{bl.brush_start} Y{brush_y} F{bl.travel_spd_xy}
        G1 Z{bl.brush_top} F{bl.travel_spd_z}

        {% for pass in range(bl.wipe_qty) %}
            G1 X{bl.brush_start + bl.brush_width} F{bl.wipe_spd_xy}
            G1 X{bl.brush_start} F{bl.wipe_spd_xy}
        {% endfor %}

        G1 Z{min_z} F{bl.travel_spd_z}
        RESTORE_GCODE_STATE NAME=blobifier_clean_state MOVE=0
    {% endif %}

[gcode_macro BLOBIFIER_PARK]
description: Park toolhead on extended Blobifier tray to catch ooze during filament swaps
variable_restore_z: 0
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set pos_max = printer.toolhead.axis_maximum %}
    {% set position_y = bl.purge_y|default(pos_max.y - bl.skew_correction - bl.y_offset)|float %}
    {% set safe = printer['gcode_macro _BLOBIFIER_SAFE_DESCEND'] %}
    {% set ignore_safe = safe.print_height < bl.force_safe_descend_height_until %}

    SET_GCODE_VARIABLE MACRO=BLOBIFIER_PARK VARIABLE=restore_z VALUE={pos.z}
    SAVE_GCODE_STATE NAME=blobifier_park_state

    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_respond_info("BLOBIFIER_PARK: Please home XYZ before parking") }
    {% else %}
        G90
        # 1. Retract tray while traveling to avoid interference
        BLOBIFIER_SERVO POS=in

        # 2. Lift to safe clearance if below tray top
        {% if pos.z < [bl.tray_top + 10.0, 15.0]|max %}
            G1 Z{[bl.tray_top + 10.0, 15.0]|max} F{bl.travel_spd_z}
        {% endif %}

        # 3. Approach rear position safely (step outward if near cutter arm)
        {% if printer.toolhead.position.y != position_y %}
            {% if printer.toolhead.position.x < 35.0 %}
                G1 X35.0 F{bl.travel_spd_xy}
            {% endif %}
            G1 X{[bl.brush_start - 20, 30]|max} Y{position_y} F{bl.travel_spd_xy}
        {% endif %}

        # 4. Move over tray
        G1 X{bl.purge_x} Y{position_y} F{bl.travel_spd_xy}

        # 5. Extend tray under nozzle
        BLOBIFIER_SERVO POS=out

        # 6. Lower nozzle onto tray surface (Z3.5)
        {% if safe.tray or ignore_safe %}
            G1 Z{bl.tray_top} F{bl.travel_spd_z}
        {% endif %}

        { action_respond_info("BLOBIFIER: Nozzle parked on Blobifier tray (X%.1f Y%.1f Z%.1f)" % (bl.purge_x, position_y, bl.tray_top)) }
    {% endif %}

    RESTORE_GCODE_STATE NAME=blobifier_park_state MOVE=0


# ============================================================================
# 4. BUCKET COUNTER & SHAKER MACROS
# ============================================================================

[gcode_macro _BLOBIFIER_COUNT]
description: Track extruded blobs and pause print if bucket reaches capacity
variable_current_blobs: 0
variable_last_shake: 0
variable_next_shake: 0
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    {% set count = printer['gcode_macro _BLOBIFIER_COUNT'] %}
    {% if count.current_blobs >= bl.max_blobs %}
        { action_respond_info("BLOBIFIER: Purge bucket is FULL (%d/%d blobs)! Pausing print." % (count.current_blobs, bl.max_blobs)) }
        M117 Empty purge bucket!
        PAUSE
    {% else %}
        {% set new_blobs = count.current_blobs + 1 %}
        SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=current_blobs VALUE={new_blobs}
        _BLOBIFIER_SAVE_STATE
        { action_respond_info("BLOBIFIER: Blobs in bucket: %d/%d (Next shake @ %s)" % (new_blobs, bl.max_blobs, count.next_shake)) }
    {% endif %}

[gcode_macro _BLOBIFIER_COUNT_RESET]
description: Reset blob counter to 0 (called when bucket is emptied)
gcode:
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=current_blobs VALUE=0
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=last_shake VALUE=0
    _BLOBIFIER_SAVE_STATE
    _BLOBIFIER_CALCULATE_NEXT_SHAKE
    { action_respond_info("BLOBIFIER: Blob counter reset to 0.") }

[gcode_macro BLOBIFIER_SHAKE_BUCKET]
description: Shake the purge bucket to disperse blobs (tuned for A4T toolhead)
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    {% set count = printer['gcode_macro _BLOBIFIER_COUNT'] %}
    {% set shakes = params.SHAKES|default(bl.bucket_shakes)|int %}
    {% set original_accel = printer.toolhead.max_accel %}
    {% set position_y = bl.purge_y|default(printer.toolhead.axis_maximum.y - bl.skew_correction - bl.y_offset)|float %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_respond_info("BLOBIFIER: Cannot shake bucket - printer not homed") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=last_shake VALUE={count.current_blobs}
        _BLOBIFIER_SAVE_STATE
        SAVE_GCODE_STATE NAME=shake_bucket_state

        G90
        # Move to safe rear approach Y
        G1 Y{position_y} F{bl.travel_spd_xy}
        # Retract tray so it does not interfere
        BLOBIFIER_SERVO POS=in
        # Lower to shaker engagement Z (2.5mm for A4T)
        G1 Z{bl.shaker_arm_z} F{bl.travel_spd_z}
        # Slide into shaker slot
        G1 X{bl.shaker_pos_x} F{bl.travel_spd_xy}

        # Shake back and forth along Y
        SET_VELOCITY_LIMIT ACCEL={bl.shake_accel}
        {% for s in range(shakes) %}
            G1 Y{position_y - 4} F{bl.travel_spd_xy}
            G1 Y{position_y} F{bl.travel_spd_xy}
        {% endfor %}
        SET_VELOCITY_LIMIT ACCEL={original_accel}

        # Exit shaker slot
        G1 X{bl.purge_x} F{bl.travel_spd_xy}
        RESTORE_GCODE_STATE NAME=shake_bucket_state MOVE=0
    {% endif %}

[gcode_macro _BLOBIFIER_CALCULATE_NEXT_SHAKE]
description: Compute blob threshold for next bucket shake
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    {% set count = printer['gcode_macro _BLOBIFIER_COUNT'] %}
    {% set remaining_blobs = bl.max_blobs - count.last_shake %}
    {% set next_shake = ((1.0 - bl.bucket_shake_frequency) * remaining_blobs + count.last_shake)|int %}
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=next_shake VALUE={next_shake}
    _BLOBIFIER_SAVE_STATE

[gcode_macro _BLOBIFIER_LOAD_STATE]
gcode:
    {% if printer.save_variables is defined and printer.save_variables.variables.blobifier is defined %}
        {% set sv = printer.save_variables.variables.blobifier %}
        SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=last_shake VALUE={sv.last_shake|default(0)}
        SET_GCODE_VARIABLE MACRO=_BLOBIFIER_COUNT VARIABLE=current_blobs VALUE={sv.current_blobs|default(0)}
    {% endif %}
    _BLOBIFIER_CALCULATE_NEXT_SHAKE

[gcode_macro _BLOBIFIER_SAVE_STATE]
gcode:
    {% if printer.save_variables is defined %}
        {% set count = printer['gcode_macro _BLOBIFIER_COUNT'] %}
        {% set sv = {'current_blobs': count.current_blobs, 'last_shake': count.last_shake} %}
        SAVE_VARIABLE VARIABLE=blobifier VALUE="{sv}"
    {% endif %}

[gcode_macro BLOBIFIER_STATUS]
description: Display current blob count and bucket state in console
gcode:
    {% set count = printer['gcode_macro _BLOBIFIER_COUNT'] %}
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    { action_respond_info("BLOBIFIER: Blobs in bucket=%d/%d, last_shake=%d, next_shake=%d" % (count.current_blobs, bl.max_blobs, count.last_shake, count.next_shake)) }


# ============================================================================
# 5. SAFE DESCEND (EXCLUDE OBJECT CLEARANCE)
# ============================================================================

[gcode_macro _BLOBIFIER_SAFE_DESCEND]
description: Object avoidance check for safe rear toolhead descent
variable_tray: True
variable_brush: True
variable_shake: True
variable_first_layer: True
variable_print_height: 0
variable_print_previous_height: 0
variable_print_layer_height: 0.3
gcode:
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
        {% set pos_max = printer.toolhead.axis_maximum %}
        {% set position_y = pos_max.y - bl.skew_correction - bl.y_offset %}
        {% set brush_y = pos_max.y - bl.skew_correction - bl.brush_y_offset %}
        {% set tray_bound = [bl.purge_x + bl.toolhead_x, position_y - bl.toolhead_y] %}
        {% set brush_bound = [bl.brush_start + bl.brush_width + bl.toolhead_x, brush_y - bl.toolhead_y] %}
        {% set objects = printer.exclude_object.objects|map(attribute='polygon') %}

        {% for polygon in objects %}
            {% for point in polygon %}
                {% if point[0] < tray_bound[0] and point[1] > tray_bound[1] %}
                    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=tray VALUE=False
                {% endif %}
                {% if point[0] < brush_bound[0] and point[1] > brush_bound[1] %}
                    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=brush VALUE=False
                {% endif %}
            {% endfor %}
        {% endfor %}
    {% endif %}

[gcode_macro _BLOBIFIER_RESET_SAFE_DESCEND]
description: Reset safe descend state at beginning of print
gcode:
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=tray VALUE=True
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=brush VALUE=True
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=shake VALUE=True
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=first_layer VALUE=True
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=print_height VALUE=0
    SET_GCODE_VARIABLE MACRO=_BLOBIFIER_SAFE_DESCEND VARIABLE=print_previous_height VALUE=0


# ============================================================================
# 6. INITIALIZATION
# ============================================================================

[gcode_macro BLOBIFIER_INIT]
description: Verify Blobifier configuration and test tray servo movement
gcode:
    _BLOBIFIER_LOAD_STATE
    BLOBIFIER_SERVO POS=out
    BLOBIFIER_SERVO POS=in
    SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=initialized VALUE=1
    { action_respond_info("BLOBIFIER: Initialization complete. Tray verified.") }

[delayed_gcode _BLOBIFIER_AUTOINIT]
initial_duration: 1.0
gcode:
    _BLOBIFIER_LOAD_STATE
    # Ensure tray servo is in safe resting position (180° = inside housing)
    SET_SERVO SERVO=blobifier ANGLE=180
    G4 P300
    SET_SERVO SERVO=blobifier WIDTH=0
    SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=initialized VALUE=1
