# ============================================================================
# KLIPPACE - Voron 2.4R2 (350mm) Geometry & Movement Variables
# ============================================================================
# Tailored to match your Voron 350 physical configuration:
#   - Cutter Pin:       X0 Y359 (engaged via Y-axis travel)
#   - Nozzle Scrubber:  X108-X158 Y350 Z6.0
#   - Purge Position:   X90 Y355 (rear rail, directly adjacent to scrubber)
#   - Kinematics:       CoreXY with Quad Z flying gantry (no bed drop)
# ============================================================================

[gcode_macro _ACE_VARS]
description: Configuration variables for ACE Pro motions on Voron 2.4 (350mm)

# --- Cutting Variables (Filametrix / Gantry Cutter Pin) ---
variable_cut_block_x: 0                 # X coordinate for pre-cut approach
variable_cut_block_y: 340               # Y coordinate for pre-cut approach
variable_cut_engage_x: 0                # X coordinate to depress cutter pin
variable_cut_engage_y: 359              # Y coordinate to depress cutter pin
variable_cut_full_x: 0                  # Full stroke X coordinate
variable_cut_full_y: 359                # Full stroke Y coordinate
variable_cut_axis: 'Y'                  # Cutting motion axis ('X' or 'Y')
variable_cut_speed: 2000                # Speed of cutting stroke (mm/min)
variable_cut_retract_distance: 10       # Post-cut retraction (mm) to disengage blade arm
variable_cut_repetitions: 1             # Number of cutting strokes
variable_cut_pause_ms: 250              # Milliseconds to dwell at full cut position
variable_pre_cut_retract_length: 2      # Retraction (mm) before reaching cutter pin

# --- Purging & Poop Area Variables ---
variable_poop_x: 90                     # X coordinate for purge (adjacent to nozzle brush)
variable_poop_y: 355                    # Y coordinate for purge (rear bed rail)
variable_poop_z: 15.0                   # Z height during purge
variable_poop_x_speed: 12000            # Travel speed to purge area (mm/min)
variable_poop_y_speed: 12000            # Travel speed into purge area (mm/min)
variable_purge_speed: 300               # Purge feedrate (mm/min)

# --- Nozzle Scrubber / Wiping Variables (Voron Decontaminator) ---
variable_wipe_enable: True              # Enable wiping over nozzle brush
variable_wipe_pattern: "STRAIGHT"       # "STRAIGHT" along X axis
variable_wipe_direction: "X"            # Wipe back and forth along X
variable_wipe_start_x: 108              # Starting X coordinate of brush
variable_wipe_start_y: 350              # Y coordinate of brush
variable_wipe_length: 50                # Length of brush stroke (X108 to X158)
variable_wipe_qty: 6                    # Number of wipe passes across brush
variable_wipe_speed: 12000              # Wipe speed (mm/min = 200 mm/s)
variable_brush_z: 6.0                   # Z height for nozzle in brush
variable_brush_clear_z: 25.0            # Z height to clear brush after wiping

# --- Post-Purge Cooling Fan Burst ---
variable_post_purge_fan_burst: True     # Turn part fan on briefly to chill purge blob
variable_post_purge_fan_speed: 255      # PWM fan speed (0-255)
variable_post_purge_fan_time: 1.0       # Seconds for fan burst

# --- Servo Wiper (Disabled on Voron) ---
variable_servo_enable: False            # Voron uses stationary brush, no servo needed
variable_servo_name: "servo_wipe"
variable_servo_deploy_angle: 0
variable_servo_retract_angle: 0
variable_servo_deploy_delay: 0.0
variable_servo_retract_delay: 0.0
variable_servo_min_z: 0
variable_servo_z_speed: 50
variable_servo_startup_zero: False
variable_bed_pause_z_drop: 0            # Set to 0: Voron bed does not drop!

# --- Pause / Resume Extruder Retraction ---
variable_pause_extruder_retract: 2.0          # mm to retract when pausing
variable_pause_extruder_retract_speed: 35.0   # Retraction speed (mm/s)
variable_resume_purge_amount: 30.0            # Purge amount (mm) on resume
variable_resume_extra_prime: 0.5              # Extra prime after wipe (mm)
variable_resume_post_wipe_retract: 0.5        # Retract after wipe (mm)

# --- Tool Unload Retraction ---
variable_unload_tool_retract: 10.0            # mm to retract before ACE rewinds
variable_unload_tool_retract_speed: 20.0      # Retraction speed (mm/s)

# --- Idle Heater Control & Default Temps ---
variable_idle_heater_off: True          # Turn off hotend when idle after manual toolchange
variable_default_nozzle_temp: 220       # Default °C when no slicer/inventory temp is set

# --- Purge Line (Underline) ---
variable_enable_purge_line: False       # Disabled: Voron PRINT_START handles adaptive/line purge

gcode:
    # Macro holds variables only
