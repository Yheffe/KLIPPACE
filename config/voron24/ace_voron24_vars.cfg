# ============================================================================
# KLIPPACE - VORON 2.4R2 (350mm) GEOMETRY & MOTION VARIABLES
# ============================================================================
# This file stores all physical coordinates, clearances, stroke speeds,
# and feature flags for multi-material toolchanging on a Voron 350mm.
#
# Hardware Layout Reference:
#   - A4T Crossbow Cutter Pin: X0 Y359 (engaged by moving Y from 340 to 359)
#   - Blobifier Purge Tray:    X5 Y360 Z3.5 (serves as nozzle park & purge station)
#   - Decontaminator Brush:    X96 to X136, Y360, Z3.0
#   - Gantry Architecture:     CoreXY flying gantry (bed never drops)
# ============================================================================

[gcode_macro _ACE_VARS]
description: Hardware coordinates and tuning variables for Voron 2.4 (350mm)

# ----------------------------------------------------------------------------
# 1. FILAMENT CUTTER (A4T Crossbow Cutter / Gantry Pin at Rear Left)
# ----------------------------------------------------------------------------
variable_cut_block_x: 0                 # Pre-cut approach X coordinate
variable_cut_block_y: 340               # Pre-cut approach Y coordinate
variable_cut_engage_x: 0                # Cutter pin engagement X coordinate
variable_cut_engage_y: 359              # Cutter pin engagement Y coordinate (depresses lever)
variable_cut_full_x: 0                  # Full stroke position X
variable_cut_full_y: 359                # Full stroke position Y
variable_cut_axis: 'Y'                  # Axis performing cutting stroke
variable_cut_speed: 2000                # Speed of cutting stroke (mm/min = 33 mm/s)
variable_cut_retract_distance: 10       # Post-cut retraction (mm) while at cutter pin
variable_cut_repetitions: 1             # Number of cutting strokes per unload
variable_cut_pause_ms: 250              # Dwell time at full stroke (ms) for clean shear
variable_pre_cut_retract_length: 2      # Small retraction (mm) before hitting cutter pin

# ----------------------------------------------------------------------------
# 2. NOZZLE PARK POSITION (BLOBIFIER TRAY AT X5 Y360 Z3.5)
# ----------------------------------------------------------------------------
# Nozzle parks on the extended Blobifier tray during filament swaps to contain
# any ooze while the ACE rewinds and feeds spools (replaces legacy silicone stopper).
variable_stopper_enable: True           # Enable parking nozzle on tray during swaps
variable_stopper_x: 5.0                 # X coordinate of Blobifier tray park
variable_stopper_y: 360.0               # Y coordinate of Blobifier tray park
variable_stopper_z: 3.5                 # Z height on tray surface
variable_stopper_clear_z: 15.0          # Safe Z height before/after parking
variable_stopper_z_speed: 1500          # Z approach and lift speed (mm/min)

# ----------------------------------------------------------------------------
# 3. PURGING & POOP DISCHARGE (MANAGED PRIMARILY BY BLOBIFIER)
# ----------------------------------------------------------------------------
# Primary purging, pulsating blob extrusion, and servo tray ejection are
# handled by BLOBIFIER (configured in blobifier.cfg). These variables provide
# travel speeds and fallback reference coordinates.
variable_poop_x: 5                      # X coordinate for purge discharge (Blobifier tray)
variable_poop_y: 360                    # Y coordinate for purge discharge (Blobifier tray)
variable_poop_z: 3.5                    # Z height during purge discharge (Blobifier tray)
variable_poop_x_speed: 12000            # Rapid travel speed to purge position (mm/min)
variable_poop_y_speed: 12000            # Rapid travel speed into purge position (mm/min)
variable_purge_speed: 300               # Extruder feedrate during purge (mm/min = 5 mm/s)

# ----------------------------------------------------------------------------
# 4. NOZZLE SCRUBBER / DECONTAMINATOR BRUSH
# ----------------------------------------------------------------------------
# Stationary brass/silicone brush mounted to the rear bed extrusion.
variable_wipe_enable: True              # Enable automatic nozzle wipe on brush
variable_wipe_pattern: "STRAIGHT"       # Linear scrub along X axis
variable_wipe_direction: "X"            # Wipe back and forth along X
variable_wipe_start_x: 96               # Left edge of brush
variable_wipe_start_y: 360              # Y coordinate of brush centerline
variable_wipe_length: 40                # Length of stroke (wipes from X96 to X136)
variable_wipe_qty: 6                    # Number of back-and-forth scrub passes
variable_wipe_speed: 12000              # Scrub speed (mm/min = 200 mm/s)
variable_brush_z: 3.0                   # Nozzle Z height inside brush bristles
variable_brush_clear_z: 10.0            # Safe Z height above brush after wiping

# ----------------------------------------------------------------------------
# 5. POST-PURGE COOLING FAN BURST
# ----------------------------------------------------------------------------
# Chills the extruded purge blob so it breaks cleanly away before scrubbing.
variable_post_purge_fan_burst: True     # Enable short cooling fan pulse
variable_post_purge_fan_speed: 255      # Part cooling fan PWM speed (0-255)
variable_post_purge_fan_time: 1.0       # Duration of cooling burst (seconds)

# ----------------------------------------------------------------------------
# 6. RETRACTIONS, PRIMING & TOOL UNLOAD
# ----------------------------------------------------------------------------
variable_pause_extruder_retract: 2.0          # Retraction (mm) on print pause
variable_pause_extruder_retract_speed: 35.0   # Speed (mm/s) for pause retraction
variable_resume_purge_amount: 30.0            # Purge volume (mm) when resuming print
variable_resume_extra_prime: 0.5              # Extra prime volume (mm) after wipe
variable_resume_post_wipe_retract: 0.5        # Retract volume (mm) after wipe before move
variable_unload_tool_retract: 10.0            # Cold zone retraction before ACE rewinds
variable_unload_tool_retract_speed: 20.0      # Speed (mm/s) for cold zone retraction

# ----------------------------------------------------------------------------
# 7. TEMPERATURE & IDLE BEHAVIOR
# ----------------------------------------------------------------------------
variable_idle_heater_off: True          # Turn off hotend heater when idle after swap
variable_default_nozzle_temp: 220       # Default fallback nozzle temperature (°C)
variable_enable_purge_line: False       # Disabled: Voron PRINT_START handles LINE_PURGE

# ----------------------------------------------------------------------------
# 8. SERVO WIPER (DISABLED ON VORON)
# ----------------------------------------------------------------------------
# The Anycubic servo poop basket is disabled. The Voron uses a stationary
# brush and purge chute. These variables prevent macro errors while disabling servos.
variable_servo_enable: False
variable_servo_name: "servo_wipe"
variable_servo_deploy_angle: 0
variable_servo_retract_angle: 0
variable_servo_deploy_delay: 0.0
variable_servo_retract_delay: 0.0
variable_servo_min_z: 0
variable_servo_z_speed: 50
variable_servo_startup_zero: False
variable_bed_pause_z_drop: 0            # Set to 0: Flying gantry, bed does not drop!

gcode:
    # Storage container for variables only
