# ============================================================================
# KLIPPACE - VORON 2.4R2 (350mm) MULTI-MATERIAL CONFIGURATION
# ============================================================================
# Master configuration file for Anycubic ACE Pro on Voron 2.4 (350mm).
#
# Physical Hardware Setup:
#   - Mainboard:        BIGTREETECH Octopus Max EZ ([mcu])
#   - Toolhead Board:   BIGTREETECH EBB36 GEN2 ([mcu EBB])
#   - Feed Mechanism:   Passive 4-in-1 Splitter (150mm top tubes + 850mm Bowden)
#   - Entry Sensor:     EBB:PD0 (Detects filament arrival at extruder gears)
#   - Nozzle Sensor:    EBB:PA15 (Detects filament seated inside nozzle)
#   - Filament Cutter:  Filametrix / Gantry Cutter Pin at X0 Y359
#   - Silicone Stopper: Nozzle resting pad at X90 Y350 Z3.5
#   - Rear Purge Area:  X90 Y355 Z15.0
#   - Nozzle Scrubber:  Decontaminator brass brush at X108-X158 Y350 Z6.0
#
# Sub-Configuration Architecture:
#   1. ace_voron24_vars.cfg     -> Motion coordinates, speeds, distances
#   2. ace_voron24_hardware.cfg -> Toolhead filament switches & pin mapping
#   3. ace_voron24_setting.cfg  -> KLIPPACE driver parameters, feeds & timers
#   4. ace_voron24_macros.cfg   -> CUT_TIP, CLEAN_NOZZLE, toolchange sequences
#
# Inclusion:
# Add this single line near the top of your printer.cfg:
#   [include ace_voron24.cfg]
# ============================================================================

[include ace_voron24_vars.cfg]
[include ace_voron24_hardware.cfg]
[include ace_voron24_setting.cfg]
[include ace_voron24_macros.cfg]
