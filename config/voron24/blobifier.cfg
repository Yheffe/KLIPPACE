# ============================================================================
# BLOBIFIER - PURGE TRAY & SERVO BUCKET ROUTINE
# ============================================================================
# Tailored for Voron 2.4R2 (350mm) + Anycubic ACE Pro + KLIPPACE.
# Replaces traditional prime towers by turning multi-material color flushes
# into compact plastic "blobs" ejected directly into a rear collection bucket.
#
# Hardware Layout Reference (Voron 350mm):
#   - A4T Cutter Pin:          X0 Y359
#   - Silicone Stopper:        X90 Y350 Z3.5
#   - Blobifier Purge Tray:    X90 Y355 Z15.0 (Tray surface)
#   - Decontaminator Brush:    X108 to X158, Y350, Z6.0
# ============================================================================

[include blobifier_hw.cfg]

[gcode_macro BLOBIFIER]
description: Purge filament into compact blob, eject via servo, and scrub nozzle
variable_purge_x: 90.0                  # X coordinate of Blobifier tray
variable_purge_y: 355.0                 # Y coordinate of Blobifier tray
variable_tray_top: 15.0                 # Z height at tray surface
variable_purge_spd: 450                 # Purge extrusion feedrate (mm/min = 7.5 mm/s)
variable_travel_spd: 12000              # Travel move speed (mm/min)
variable_z_spd: 1500                    # Z move speed (mm/min)

# Purge volume tuning
variable_purge_length: 50.0             # Default purge length (mm) if none provided
variable_purge_length_minimum: 15.0     # Minimum required purge to guarantee nozzle prime
variable_purge_length_modifier: 1.0     # Global scaling factor for slicer flush length
variable_purge_length_maximum: 100.0    # Maximum filament per blob before splitting into multiple blobs

# Blob extrusion profile
variable_blob_lift_z: 6.0               # Z lift during blob extrusion (mm)
variable_retract_length: 1.5            # Anti-ooze retraction after blob completes (mm)
variable_retract_spd: 1800              # Anti-ooze retraction speed (mm/min = 30 mm/s)

# Servo ejection parameters
variable_servo_name: "blobifier"        # Name of [servo] section in blobifier_hw.cfg
variable_tray_angle_out: 0              # Tray extended under nozzle (0° = OUT)
variable_tray_angle_in: 180             # Tray retracted inside base (180° = IN)
variable_eject_angle: 180               # Retract tray into housing to scrape blob into bucket
variable_retract_angle: 180             # Resting / retracted tray angle
variable_dwell_time: 0.4                # Pause at position for servo travel (seconds)
variable_turn_off_servo: True           # Power off PWM to prevent servo buzz and overheating

# Brush wipe parameters (scrubbing motion handled by CLEAN_NOZZLE in ace_voron24_vars.cfg)
variable_wipe_enable: True              # Scrub nozzle across brush after blob ejection

gcode:
    # 1. Determine final purge length
    {% set raw_purge = params.PURGE_LENGTH|default(purge_length)|float %}
    {% set calculated_purge = (raw_purge * purge_length_modifier)|round(1) %}
    {% set final_purge = [calculated_purge, purge_length_minimum]|max %}

    # Calculate number of blobs if purge exceeds maximum blob capacity
    {% set num_blobs = ((final_purge / purge_length_maximum) + 0.999)|int %}
    {% set purge_per_blob = (final_purge / num_blobs)|round(1) %}

    { action_respond_info("Blobifier: Purging total %.1fmm in %d blob(s) (%.1fmm each)" % (final_purge, num_blobs, purge_per_blob)) }

    # Save current motion state
    SAVE_GCODE_STATE NAME=blobifier_state

    # 2. Lift Z safely if below tray clearance
    G90
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set clear_z = [tray_top + 10.0, cur_z]|max %}
    G1 Z{clear_z} F{z_spd}

    # 3. Produce each blob in sequence
    {% for blob_idx in range(num_blobs) %}
        { action_respond_info("Blobifier: Forming blob %d of %d..." % (blob_idx + 1, num_blobs)) }

        # Extend tray under nozzle before purging
        BLOBIFIER_SERVO POS=out

        # Move toolhead over extended tray
        G1 X{purge_x} Y{purge_y} F{travel_spd}
        G1 Z{tray_top + 1.0} F{z_spd}

        # Extrude filament while slowly lifting Z to build neat compact blob
        M83
        G92 E0
        G1 Z{tray_top + blob_lift_z} E{purge_per_blob} F{purge_spd}

        # Anti-ooze snap retraction
        G1 E-{retract_length} F{retract_spd}
        G92 E0

        # Rapid lift off blob
        G1 Z{tray_top + 12.0} F{z_spd}

        # Retract tray inside housing to strip/drop blob into bucket
        BLOBIFIER_SERVO POS=in
    {% endfor %}

    # 4. Wipe nozzle across decontaminator brush
    {% if wipe_enable %}
        BLOBIFIER_CLEAN
    {% endif %}

    # Ensure tray is safely retracted
    BLOBIFIER_SERVO POS=in

    # Restore motion state
    RESTORE_GCODE_STATE NAME=blobifier_state MOVE=0


# ============================================================================
# HELPER MACROS
# ============================================================================

[gcode_macro BLOBIFIER_SERVO]
description: Move Blobifier tray between in (retracted) and out (extended) positions
gcode:
    {% set b = printer["gcode_macro BLOBIFIER"] %}
    {% set pos = params.POS|default("in")|lower %}
    {% if pos == "out" %}
        SET_SERVO SERVO={b.servo_name} ANGLE={b.tray_angle_out}
    {% else %}
        SET_SERVO SERVO={b.servo_name} ANGLE={b.tray_angle_in}
    {% endif %}
    G4 P{(b.dwell_time * 1000)|int}
    {% if b.turn_off_servo %}
        SET_SERVO SERVO={b.servo_name} WIDTH=0
    {% endif %}

[gcode_macro BLOBIFIER_SERVO_DEPLOY]
description: Extend Blobifier tray under nozzle (POS=out)
gcode:
    BLOBIFIER_SERVO POS=out

[gcode_macro BLOBIFIER_SERVO_RETRACT]
description: Retract Blobifier tray inside base to drop blob (POS=in)
gcode:
    BLOBIFIER_SERVO POS=in

[gcode_macro BLOBIFIER_CLEAN]
description: Scrub nozzle across decontaminator brush using established CLEAN_NOZZLE macro
gcode:
    {% if printer["gcode_macro CLEAN_NOZZLE"] is defined %}
        CLEAN_NOZZLE
    {% elif printer["gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE"] is defined %}
        RESUME_NOZZLE_WIPE_SEQUENCE
    {% else %}
        { action_respond_info("BLOBIFIER_CLEAN: CLEAN_NOZZLE macro is not loaded.") }
    {% endif %}

[gcode_macro BLOBIFIER_PARK]
description: Park toolhead using established PARK_ON_STOPPER macro
gcode:
    {% if printer["gcode_macro PARK_ON_STOPPER"] is defined %}
        PARK_ON_STOPPER
    {% elif printer["gcode_macro PARK"] is defined %}
        PARK
    {% elif printer["gcode_macro TO_THROW_POSITION"] is defined %}
        TO_THROW_POSITION
    {% else %}
        { action_respond_info("BLOBIFIER_PARK: PARK_ON_STOPPER macro is not loaded.") }
    {% endif %}
