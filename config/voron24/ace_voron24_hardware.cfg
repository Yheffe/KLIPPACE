# ============================================================================
# KLIPPACE - Voron 2.4 Hardware Sensors Configuration
# ============================================================================
# Configured for:
#   Mainboard:       BIGTREETECH Octopus Max EZ ([mcu])
#   Toolhead Board:  BIGTREETECH EBB36 GEN2 ([mcu EBB])
# ============================================================================

# ----------------------------------------------------------------------------
# Primary Toolhead Entry Sensor (Before Extruder Gears)
# Pin: EBB:PD0 (labeled Extruder_Switch on EBB36 GEN2)
# Used by ACE Pro driver to detect when filament arrives at the extruder entry.
# When this triggers during feeding, ACE slows down and coordinates with the
# extruder motor to grab the filament.
# ----------------------------------------------------------------------------
[filament_switch_sensor filament_entry_sensor]
switch_pin: ^EBB:PD0
pause_on_runout: False        # Handled by ACE driver's runout_monitor
event_delay: 3.0
pause_delay: 0.5
# Note: If your switch is normally-closed instead of normally-open, invert the pin:
# switch_pin: ^!EBB:PD0

# ----------------------------------------------------------------------------
# Secondary Toolhead Nozzle Sensor (At / After Extruder Gears)
# Pin: EBB:PA15 (labeled Toolhead_Switch on EBB36 GEN2)
# Detects filament presence inside or directly below the extruder.
# ----------------------------------------------------------------------------
[filament_switch_sensor filament_nozzle_sensor]
switch_pin: ^EBB:PA15
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5
# Note: If your switch is normally-closed instead of normally-open, invert the pin:
# switch_pin: ^!EBB:PA15

# ----------------------------------------------------------------------------
# Optional Sensors (Disabled by default on Voron)
# ----------------------------------------------------------------------------

# Anycubic Return Detection Module (RDM) 4-in-1 buffer sensor
# Uncomment and configure pin if you have mounted the Anycubic RDM module
# [filament_switch_sensor filament_runout_rdm]
# switch_pin: PG12   # Set to your Octopus Max EZ free endstop/diag pin
# pause_on_runout: False

# Filament Motion Encoder (BTT SFS v2.0 or Anycubic encoder)
# [filament_motion_sensor ace_encoder]
# detection_length: 10.00
# extruder: extruder
# switch_pin: PG11   # Set to your Octopus Max EZ sensor pin
# pause_on_runout: True
# event_delay: 3.0
# pause_delay: 0.5

# NOTE: The Anycubic servo wiper ([servo servo_wipe]) is intentionally NOT
# defined here to avoid pin conflicts with the EBB36 extruder step pin (EBB:PB14).
