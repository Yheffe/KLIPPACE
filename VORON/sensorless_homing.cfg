# ============================================================================
# SENSORLESS HOMING CONFIGURATION & MACROS (Voron 2.4 CoreXY)
# ============================================================================
# This file provides dedicated homing routines for sensorless homing on
# the TMC2209 stepper drivers (BTT Octopus Max EZ).
#
# StallGuard Sensitivity (configured in printer.cfg):
#   - Stepper X: driver_SGTHRS = 60
#   - Stepper Y: driver_SGTHRS = 120
#
# Sensorless Homing Workflow:
#   1. Temporarily lowers motor current to 0.700A on both A and B steppers
#      to prevent excessive impact force against mechanical endstops.
#   2. Executes homing move (G28 X or G28 Y).
#   3. Backs off away from the physical endstop.
#   4. Dwells for 1000ms (G4 P1000) to ensure the TMC StallGuard registers
#      and driver internal state have fully cleared.
#   5. Restores original run current (0.800A) for printing.
# ============================================================================

[gcode_macro _HOME_X]
description: Safely home X axis using TMC2209 StallGuard sensorless detection
gcode:
    # Read normal running currents from configuration
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.70 %}

    # Lower motor currents to reduce endstop impact force
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Execute X-axis homing
    G28 X

    # Move away from X endstop bumper
    G91
    G1 X-50 F2500

    # Wait 1 second for TMC StallGuard registers to settle
    G4 P1000

    # Restore printing run currents
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
description: Safely home Y axis using TMC2209 StallGuard sensorless detection
gcode:
    # Read normal running currents from configuration
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.70 %}

    # Lower motor currents to reduce endstop impact force
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Execute Y-axis homing
    G28 Y

    # Move away from Y endstop bumper
    G91
    G1 Y-10 F1200

    # Wait 1 second for TMC StallGuard registers to settle
    G4 P1000

    # Restore printing run currents
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}