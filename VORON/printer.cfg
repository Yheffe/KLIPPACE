# ============================================================================
# VORON 2.4R2 (350mm) - MAIN PRINTER CONFIGURATION
# ============================================================================
# Mainboard:         BIGTREETECH Octopus Max EZ (STM32H723, 25MHz crystal)
# Toolhead Board:    BIGTREETECH EBB36 GEN2 (STM32G0B1, CAN/USB)
# Multi-Material:    Anycubic ACE Pro via KLIPPACE
# Kinematics:        CoreXY + Quad Z Flying Gantry (QGL)
# ============================================================================

# ----------------------------------------------------------------------------
# CONFIGURATION INCLUDES
# ----------------------------------------------------------------------------
[include ace_voron24.cfg]          # KLIPPACE: Multi-material ACE Pro driver & macros
[include mainsail.cfg]             # Mainsail client UI configuration
[include timelapse.cfg]            # Moonraker timelapse macro support
[include ebb36_gen2.cfg]           # Toolhead board (extruder, hotend, fans, probe)
[include sensorless_homing.cfg]    # Sensorless homing macros for X & Y axes

# ----------------------------------------------------------------------------
# SYSTEM FEATURES & ENHANCEMENTS
# ----------------------------------------------------------------------------
[exclude_object]                   # Object cancellation support from slicer

[firmware_retraction]              # Firmware-level retraction support (G10/G11)

[gcode_arcs]
resolution: 0.1                    # Enable native arc fitting (G2/G3 moves)

[force_move]
enable_force_move: True            # Allow kinematic moves before homing (maintenance)

[idle_timeout]
timeout: 36000                     # Idle shutdown timeout (seconds = 10 hours)

# ----------------------------------------------------------------------------
# MICROCONTROLLER UNITS (MCUs)
# ----------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_1B0017001051313236343430-if00
#canbus_uuid: b42bed1a1d67

#[mcu MMB]
#canbus_uuid: 5c5400ac5f7d

# ----------------------------------------------------------------------------
# PRINTER KINEMATICS & LIMITS
# ----------------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 300                  # Max XY velocity (mm/s)
max_accel: 4000                    # Max XY acceleration (mm/s^2)
max_z_velocity: 15                 # Max Z velocity (mm/s)
max_z_accel: 350                   # Max Z acceleration (mm/s^2)
square_corner_velocity: 5.0        # Junction deviation / square corner velocity (mm/s)

# ----------------------------------------------------------------------------
# ENCLOSURE & LIGHTING
# ----------------------------------------------------------------------------
[neopixel Chamber_Lighting]
pin: PE10                          # Octopus Max EZ RGB header
chain_count: 25                    # Total number of LEDs in chamber chain
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

# ============================================================================
# MOTION SYSTEM: X & Y AXES (CoreXY Gantry)
# ============================================================================

# ----------------------------------------------------------------------------
# X-AXIS (B Motor - Left Rear) -> Motor-1
# ----------------------------------------------------------------------------
[stepper_x]
step_pin: PE4
dir_pin: !PE5
enable_pin: !PE3
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 355
position_max: 355
homing_speed: 80
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PG13
interpolate: false
diag_pin: PF2
driver_SGTHRS: 60                  # Sensorless homing StallGuard threshold
run_current: 0.800
stealthchop_threshold: 0

# ----------------------------------------------------------------------------
# Y-AXIS (A Motor - Right Rear) -> Motor-2
# ----------------------------------------------------------------------------
[stepper_y]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PE6
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 360
position_max: 360
homing_speed: 80
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PG14
interpolate: false
diag_pin: PF0
driver_SGTHRS: 120                 # Sensorless homing StallGuard threshold
run_current: 0.800
stealthchop_threshold: 0

# ============================================================================
# MOTION SYSTEM: Z AXIS (Quad Z Flying Gantry)
# ============================================================================

# ----------------------------------------------------------------------------
# Z0: Front Left -> Motor-3
# ----------------------------------------------------------------------------
[stepper_z]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16
position_min: -5
position_max: 230
homing_speed: 50
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z]
uart_pin: PG12
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

# ----------------------------------------------------------------------------
# Z1: Rear Left -> Motor-4
# ----------------------------------------------------------------------------
[stepper_z1]
step_pin: PB8
dir_pin: PB9
enable_pin: !PB7
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper_z1]
uart_pin: PG11
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

# ----------------------------------------------------------------------------
# Z2: Rear Right -> Motor-5
# ----------------------------------------------------------------------------
[stepper_z2]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper_z2]
uart_pin: PG10
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

# ----------------------------------------------------------------------------
# Z3: Front Right -> Motor-6
# ----------------------------------------------------------------------------
[stepper_z3]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper_z3]
uart_pin: PG9
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 999999

# ============================================================================
# BED HEATING & THERMAL MANAGEMENT
# ============================================================================
[heater_bed]
heater_pin: PF6
sensor_pin: PB1                    # TB header on Octopus Max EZ
sensor_type: Generic 3950
pwm_cycle_time: 0.01666            # 60Hz mains frequency anti-flicker
min_temp: 0
max_temp: 120
max_power: 0.85

# ============================================================================
# ELECTRONICS & CHAMBER FANS
# ============================================================================
[controller_fan Nevermore]
pin: PA4                           # Fan header on Octopus Max EZ
max_power: 0.75
off_below: 0.10
heater: heater_bed

[controller_fan Power_Supply]
pin: PA6
max_power: 0.30
off_below: 0.10
kick_start_time: 0.5
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z

[controller_fan Controller_Fan]
pin: PA5
max_power: 0.50
off_below: 0.10
kick_start_time: 0.5
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z

# ============================================================================
# TEMPERATURE SENSORS
# ============================================================================
[temperature_sensor Raspberry_Pi_4B]
sensor_type: temperature_host
max_temp: 100

[temperature_sensor Octopus_Max_EZ]
sensor_type: temperature_mcu
max_temp: 100

[temperature_sensor EBB36_GEN2]
sensor_type: temperature_mcu
sensor_mcu: EBB
max_temp: 100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PB0                    # T1 header on Octopus Max EZ

# ============================================================================
# PROBING, GANTRY LEVELING & BED MESH
# ============================================================================

# ----------------------------------------------------------------------------
# Toolhead Probe (Voron Tap / Klicky on EBB36)
# ----------------------------------------------------------------------------
[probe]
pin: EBB:PB8
x_offset: 0
y_offset: 0
#z_offset: calibrated in SAVE_CONFIG
speed: 5.0
samples: 2
lift_speed: 50
samples_result: median
sample_retract_dist: 4.0
samples_tolerance: 0.016
samples_tolerance_retries: 3

# Safety logic: lower hotend temperature before probing to prevent bed denting
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

# ----------------------------------------------------------------------------
# Safe Z Homing
# ----------------------------------------------------------------------------
[safe_z_home]
home_xy_position: 177.5, 180       # Center of 350mm build bed
z_hop: 10

# ----------------------------------------------------------------------------
# Quad Gantry Leveling (QGL for Voron 350mm)
# ----------------------------------------------------------------------------
[quad_gantry_level]
gantry_corners:
   -60, -10
   415, 420
points:
   50, 25
   50, 315
   305, 315
   305, 25
speed: 500
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.0075
max_adjust: 10

# ----------------------------------------------------------------------------
# Bed Mesh
# ----------------------------------------------------------------------------
[bed_mesh]
speed: 300
horizontal_move_z: 10
probe_count: 20, 20
algorithm: bicubic
mesh_min: 25, 35
mesh_max: 325, 350

# ============================================================================
# PRINT WORKFLOW & G-CODE MACROS
# ============================================================================

# ----------------------------------------------------------------------------
# PRINT_START Macro
# Slicer Start G-code example:
#   PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer] INITIAL_TOOL=[initial_tool]
# ----------------------------------------------------------------------------
[gcode_macro PRINT_START]
description: Pre-print preparation, heating, QGL, bed mesh, and tool loading
gcode:
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    # 1. Full home (XYZ) and absolute positioning
    G28
    G90

    # 2. Clear old saved bed mesh
    BED_MESH_CLEAR

    # 3. Chamber Heatsoak (if bed target > 90°C)
    {% if target_bed > 90 %}
        G1 X{x_wait} Y{y_wait} Z15 F9000
        M190 S{target_bed}
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
    {% else %}
        G1 X{x_wait} Y{y_wait} Z15 F9000
        M190 S{target_bed}
        G4 P300000                     # 5 minute bed temperature soak
    {% endif %}

    # 4. Heat hotend to probe safe temp (150°C) and clean nozzle
    M109 S150
    CLEAN_NOZZLE                       # Wipe nozzle clean on brush before probing

    # 5. Quad Gantry Leveling and re-home Z
    QUAD_GANTRY_LEVEL
    G28 Z

    # 6. Adaptive Bed Mesh calibration
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 7. Heat hotend to final printing temperature
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M107                               # Ensure part cooling fan is off
    M109 S{target_extruder}

    # 8. ACE Pro Initial Tool Load Hook (Multi-Material)
    {% if params.INITIAL_TOOL is defined %}
        ACE_ON_PRINT_START INITIAL_TOOL={params.INITIAL_TOOL|int}
    {% endif %}

    # 9. Adaptive prime line before printing
    LINE_PURGE

# ----------------------------------------------------------------------------
# PRINT_END Macro
# Slicer End G-code: PRINT_END
# ----------------------------------------------------------------------------
[gcode_macro PRINT_END]
description: Post-print shutdown, anti-stringing retract, and gantry park
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                               # Wait for moves to finish
    G92 E0                             # Zero extruder
    G1 E-5.0 F1800                     # Retract filament to prevent oozing
    TURN_OFF_HEATERS

    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000    # Break string
    G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 2} F3600  # Park at rear
    M107                               # Turn off part fan

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

# ----------------------------------------------------------------------------
# ADAPTIVE_PURGE Macro
# ----------------------------------------------------------------------------
[gcode_macro ADAPTIVE_PURGE]
description: Draw adaptive purge line near the printed object bounding box
gcode:
    {% set area_min_x = params.AREA_MIN_X|default(10)|float %}
    {% set area_min_y = params.AREA_MIN_Y|default(10)|float %}
    {% set purge_height = 0.30 %}
    {% set purge_x = [area_min_x - 5, 5]|max %}
    {% set purge_y_start = [area_min_y, 10]|max %}
    {% set purge_y_end = purge_y_start + 45 %}

    G92 E0
    M83

    # Travel to start position
    G1 Z2.0 F750
    G1 X{purge_x} Y{purge_y_start} Z2.0 F5000.0
    G1 Z{purge_height} F500

    # Anchor blob
    G1 E20 F150
    G4 P500

    # Draw dual purge lines
    G1 X{purge_x} Y{purge_y_end} Z{purge_height} F275.0 E70.0
    G1 X{purge_x + 0.75} Y{purge_y_end} Z{purge_height} F1250.0
    G1 X{purge_x + 0.75} Y{purge_y_start} Z{purge_height} F350.0 E75.0

    # Anti-ooze retract and diagonal snap
    G1 E-1.5 F1800
    G92 E0
    G1 Z1.0 F750
    G1 X{purge_x + 15} Y{purge_y_start - 5} F4000.0
    G92 E0

# ----------------------------------------------------------------------------
# MULTI-MATERIAL HARDWARE MACROS NOTE:
# - CUT_TIP:      Defined in ace_voron24_macros.cfg (A4T Crossbow cutter at X0 Y359)
# - CLEAN_NOZZLE: Defined in ace_voron24_macros.cfg (X108-X158 Y350 brush wipe)
# Using the central definitions in ace_voron24_macros.cfg prevents duplicate
# macro registration conflicts while referencing variables in ace_voron24_vars.cfg.
