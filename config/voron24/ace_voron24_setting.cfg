# ============================================================================
# KLIPPACE - ACE PRO DRIVER SETTINGS FOR VORON 2.4 (350mm)
# ============================================================================
# Calibrated Physical Setup:
#   - ACE Unit Location:     Top panel of Voron 2.4
#   - ACE to 4-in-1 Splitter: ~150mm individual PTFE tubes
#   - Splitter to Toolhead:  ~850mm common reverse Bowden tube
#   - Total Feeding Path:    ~1000 - 1050mm (ACE internal drive to entry sensor)
#   - Entry Sensor:          EBB:PD0 (filament_entry_sensor)
#   - Nozzle Sensor:         EBB:PA15 (filament_nozzle_sensor)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. STATE PERSISTENCE & USER INTERFACE VIRTUAL PINS
# ----------------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[virtual_pins]

# Toggle ACE Pro multi-material features on/off from Mainsail / Fluidd UI
[output_pin ACE_Pro]
pin: virtual_pin:ace_pro
pwm: False
value: 1
shutdown_value: 0

# Toggle automatic unload when print finishes
[output_pin AUTO_UNLOAD]
pin: virtual_pin:auto_unload
pwm: False
value: 1
shutdown_value: 0

# Toggle adaptive bed mesh calibration (1 = adaptive, 0 = full bed mesh)
[output_pin bed_mesh_adaptive]
pin: virtual_pin:bed_mesh_adaptive_pin
value: 1

[respond]

# ============================================================================
# 2. ACE PRO DRIVER CORE PARAMETERS
# ============================================================================
[ace]
ace_count: 1                           # Number of connected ACE units (1 or 2)
baud: auto                             # auto = 115200 for ACE1, 230400 for ACE2
protocol: auto                         # Auto-detect serial protocol version

# ----------------------------------------------------------------------------
# DUAL-SENSOR TOOLHEAD CONFIGURATION (EBB36 Toolhead)
# ----------------------------------------------------------------------------
filament_runout_sensor_name_entry: filament_entry_sensor   # Switch above gears (^EBB:PD0)
filament_runout_sensor_name_nozzle: filament_nozzle_sensor # Switch below gears (^EBB:PA15)
max_entry_to_nozzle_length: 80         # Safety maximum distance (mm) from entry to nozzle switch
runout_debounce_count: 3               # Sensor debounce filter (3 cycles ≈ 150ms)

# Automatically enable feed-assist after establishing connection
feed_assist_active_after_ace_connect: True

# ----------------------------------------------------------------------------
# FEEDING & RETRACTION SPEEDS
# ----------------------------------------------------------------------------
feed_speed: 60                         # High-speed Bowden feed velocity (mm/s)
retract_speed: 50                      # High-speed Bowden retract velocity (mm/s)

# ----------------------------------------------------------------------------
# SPOOL INSERTION AUTO-PARK RETRACTION (150mm Splitter Setup)
# ----------------------------------------------------------------------------
# On spool insertion, the ACE hardware automatically grabs and feeds ~500-550mm.
# Once the slot reports ready, KLIPPACE rewinds 400mm so the filament tip rests
# ~100-150mm from the ACE (~50mm before the 4-in-1 splitter), keeping the splitter
# completely clear so all other slots can feed freely without mechanical jams.
spool_load_park_retract_length: 400    # Rewind distance (mm) upon spool insertion
spool_load_park_retract_speed: 50      # Rewind speed (mm/s)

# ----------------------------------------------------------------------------
# TUBE LENGTHS & SAFETY LIMITS
# ----------------------------------------------------------------------------
total_max_feeding_length: 1500         # Hard cutoff distance: pause print if sensor never trips
parkposition_to_toolhead_length: 1050  # Distance from park position to toolhead entry sensor
toolchange_load_length: 1100           # High-speed feed length approaching entry sensor

# ----------------------------------------------------------------------------
# COORDINATED PRESSURIZED TOOLHEAD ENTRY
# ----------------------------------------------------------------------------
# Once the entry switch (EBB:PD0) trips, the ACE continues pushing forward at 16 mm/s
# while the extruder motor steps forward at 8 mm/s. This differential feedrate builds
# positive forward pressure inside the Bowden tube to overcome the mechanical resistance
# of the entry switch lever and seat firmly into the extruder drive gears.
extruder_feeding_length: 35            # Distance used in single-sensor fallback mode (mm)
extruder_feeding_speed: 8              # Extruder stepper speed (mm/s) during entry coordination
ace_entry_feeding_speed: 16            # ACE Pro forward feed speed (mm/s) during entry coordination

# ----------------------------------------------------------------------------
# TOOLHEAD RETRACTION & PRIMING
# ----------------------------------------------------------------------------
pre_cut_retract_length: 2              # Retraction (mm) before reaching cutter pin
toolhead_retraction_length: 25         # Cold zone retraction (mm) before full rewind
toolhead_retraction_speed: 15          # Retraction speed (mm/s)
toolhead_full_purge_length: 50         # Prime distance (mm) pushed through melt zone
toolhead_slow_loading_speed: 5         # Initial melt zone feed speed (mm/s)

# ----------------------------------------------------------------------------
# PURGE & FLUSH SETTINGS (Toolchange Color Purge)
# ----------------------------------------------------------------------------
default_color_change_purge_length: 50  # Default purge length (mm) when no slicer data
default_color_change_purge_speed: 300  # Purge extrusion feedrate (mm/min = 5 mm/s)
purge_max_chunk_length: 200            # Chunk size (mm) to prevent backpressure buildup
purge_multiplier: 1.0                  # Global purge volume scalar

# ----------------------------------------------------------------------------
# MOONRAKER LANE DATA SYNC (OrcaSlicer / Spoolman Filament Metadata)
# ----------------------------------------------------------------------------
moonraker_lane_sync_enabled: True
moonraker_lane_sync_url: http://127.0.0.1:7125
moonraker_lane_sync_namespace: lane_data
moonraker_lane_sync_timeout: 2.0
moonraker_lane_sync_unknown_material_mode: empty
moonraker_lane_sync_unknown_material_markers: ???,unknown,n/a,none
moonraker_lane_sync_unknown_material_map_to: PLA

# Maximum allowed temperature for ACE Pro drying chamber (°C)
max_dryer_temperature: 65

# ----------------------------------------------------------------------------
# DRYER HEATER & SENSOR REGISTRATION
# ----------------------------------------------------------------------------
[temperature_ace]

# Real-time temperature sensor displayed in Mainsail and OrcaSlicer Device tab
[temperature_sensor ace_dryer]
sensor_type: temperature_ace
ace_instance: 0
min_temp: 0
max_temp: 70

