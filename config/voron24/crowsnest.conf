#### crowsnest.conf - Optimized for Raspberry Pi Camera v2 (Sony IMX219) on Voron 2.4
[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose                      # Valid Options are quiet/verbose/debug
delete_log: false                       # Deletes log on every restart, if set to true
no_proxy: false                         # If set to true, no reverse proxy is required.

[cam 1]
mode: camera-streamer                         # camera-streamer provides hardware WebRTC H.264 & high-res snapshots
port: 8080                              # HTTP/MJPG stream/snapshot port
device: /base/soc/i2c0mux/i2c@1/imx219@10     # Native Sony IMX219 sensor on CSI bus
resolution: 1640x1232                   # 4:3 Full Field-of-View 2x2 binned native sensor mode (maximum vertical height)
max_fps: 30                             # Smooth 30 FPS playback
custom_flags: --camera-snapshot.height=0 --camera-video.height=720 --webrtc-disable_client_ice=1 --camera-allow_dma=1 --camera-nbufs=3 --camera-video.options=video_bitrate=1500000 --camera-video.options=h264_i_frame_period=30 --camera-snapshot.options=compression_quality=90 --camera-options=NoiseReductionMode=2 --camera-options=Sharpness=1.5
